<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href=".visual-comment-fixture.bundle.css" />
    <style>
      body { margin: 0; font-family: sans-serif; }
      #storybook-root { position: relative; width: 400px; height: 240px; background: rgb(245 246 248); }
      #prototype-action { margin: 40px; width: 120px; height: 48px; }
      #modal { position: absolute; inset: 90px 80px 20px; background: rgb(80 100 220); }
      #ignored-chrome { position: absolute; right: 0; bottom: 0; width: 60px; height: 60px; background: rgb(255 0 0); }
      #portal { width: 80px; height: 40px; background: rgb(30 180 100); }
      #zero { width: 0; height: 0; overflow: hidden; }
      #review-mount { position: relative; z-index: 10; }
      #fixture-result { display: none; }
    </style>
  </head>
  <body>
    <main id="storybook-root" data-prototype-root="portfolio" data-route="/portfolio" data-prototype-state="modal-open">
      <button id="prototype-action">Prototype action</button>
      <div id="modal">Modal is open</div>
      <div id="ignored-chrome" data-sbfx-capture-ignore>Ignored addon chrome</div>
    </main>
    <div id="portal">Body portal</div>
    <div id="zero"></div>
    <div id="review-mount"></div>
    <pre id="fixture-result"></pre>
    <script>
      addEventListener("error", (event) => {
        document.querySelector("#fixture-result").textContent = btoa(JSON.stringify({ error: String(event.error?.stack || event.message), results: [] }));
      });
      addEventListener("unhandledrejection", (event) => {
        document.querySelector("#fixture-result").textContent = btoa(JSON.stringify({ error: String(event.reason?.stack || event.reason), results: [] }));
      });
    </script>
    <script src=".visual-comment-fixture.bundle.js"></script>
  </body>
</html>
