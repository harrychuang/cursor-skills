          || completed.status !== "completed"
          || completed.revision !== task.revision + 1
        ) {
          cleanupSession.applyInFlight = false;
          if (activeView === "cleanup") renderCleanupView();
          setFailure("cleanup-complete", COPY.cleanupCompletionFailure, null, "invalid-cleanup-completion-response");
          setStatus(COPY.cleanupCompletionFailure, "error");
          return;
        }
        cleanupSession.task = Object.assign({}, task, completed, { plan: task.plan, failure: null });
        cleanupSession.completionSummary = {
          appliedCount: attempt.proof.appliedCount,
          skippedCount: attempt.proof.skippedCount,
        };
        cleanupSession.failureContext = null;
        cleanupSession.applyInFlight = false;
        cleanupSession.applyAttempt = null;
        cleanupSession.confirmationOpen = false;
        clearFailure();
        if (activeView === "cleanup") renderCleanupView();
        setStatus(COPY.cleanupCompleted);
      }

      async function submitCleanupFailure() {
        var task = cleanupSession.task;
        var attempt = cleanupSession.applyAttempt;
        var report = attempt && attempt.failureReport;
        if (!task || !attempt || !report || !reviewerKey) return;
        if (!attempt.failurePayload) {
          attempt.failurePayload = {
            revision: task.revision,
            errorCode: report.errorCode,
            rolledBack: report.rolledBack,
            affectedNodeIds: report.affectedNodes.map(function (node) { return node.nodeId; }),
          };
        }
        attempt.phase = "fail";
        cleanupSession.applyInFlight = true;
        if (activeView === "cleanup") renderCleanupView();
        var response;
        try {
          response = await fetch(coordinatorUrl + "/v1/automation/tasks/" + encodeURIComponent(task.id) + "/fail", {
            method: "POST",
            headers: {
              Accept: "application/json",
              Authorization: "Bearer " + reviewerKey,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(attempt.failurePayload),
          });
        } catch (error) {
          if (cleanupSession.applyAttempt !== attempt) return;
          cleanupSession.applyInFlight = false;
          if (activeView === "cleanup") renderCleanupView();
          var pendingSummary = cleanupFailureMessage(report) + " " + COPY.cleanupFailureSyncFailure;
          setFailure("cleanup-fail", pendingSummary, "cleanup-fail", COPY.diagnosticNetwork);
          setStatus(pendingSummary, "error");
          return;
        }
        if (cleanupSession.applyAttempt !== attempt) return;
        if (response.status === 401) {
          reviewerKey = "";
          cleanupSession.applyInFlight = false;
          renderLogin(COPY.invalidAccessCode);
          return;
        }
        if (!response.ok) {
          cleanupSession.applyInFlight = false;
          if (activeView === "cleanup") renderCleanupView();
          var failureSummary = cleanupFailureMessage(report) + " " + COPY.cleanupFailureSyncFailure;
          var failureRetryAction = response.status >= 500 ? "cleanup-fail" : null;
          setFailure("cleanup-fail", failureSummary, failureRetryAction, copy("diagnosticHttp", { status: response.status }));
          setStatus(failureSummary, "error");
          return;
        }
        var failed;
        try {
          failed = await response.json();
        } catch (error) {
          failed = null;
        }
        var expectedStatus = report.errorCode === "stale-plan" ? "stale" : "blocked";
        if (
          cleanupSession.applyAttempt !== attempt
          || !failed
          || failed.id !== task.id
          || failed.taskType !== task.taskType
          || failed.scopeNodeId !== task.scopeNodeId
          || failed.status !== expectedStatus
          || failed.revision !== task.revision + 1
        ) {
          cleanupSession.applyInFlight = false;
          if (activeView === "cleanup") renderCleanupView();
          setFailure("cleanup-fail", COPY.cleanupFailureSyncFailure, null, "invalid-cleanup-failure-response");
          setStatus(COPY.cleanupFailureSyncFailure, "error");
          return;
        }
        cleanupSession.task = Object.assign({}, task, failed, { plan: failed.plan || task.plan });
        cleanupSession.failureContext = report;
        cleanupSession.applyInFlight = false;
        cleanupSession.applyAttempt = null;
        cleanupSession.confirmationOpen = false;
        var summary = cleanupFailureMessage(report);
        if (activeView === "cleanup") renderCleanupView();
        setFailure("cleanup-result", summary, null, report.errorCode);
        setStatus(summary, "error");
      }

      function handleCleanupApplyResult(message) {
        var task = cleanupSession.task;
        var attempt = cleanupSession.applyAttempt;
        if (
          !task
          || !attempt
          || attempt.phase !== "main-apply"
          || message.requestId !== attempt.requestId
          || message.taskId !== attempt.taskId
          || message.scopeNodeId !== attempt.scopeNodeId
          || message.inputSnapshotHash !== attempt.inputSnapshotHash
          || !cleanupSession.applyInFlight
        ) return;
        if (message.ok === true) {
          var proof = cleanupCompletionProof(message, task, attempt);
          if (!proof) {
            cleanupSession.applyInFlight = false;
            if (activeView === "cleanup") renderCleanupView();
            setFailure("cleanup-apply-result", COPY.cleanupInvalidApplyResult, null, "invalid-cleanup-apply-result");
            setStatus(COPY.cleanupInvalidApplyResult, "error");
            return;
          }
          attempt.proof = proof;
          submitCleanupCompletion();
          return;
        }
        var affectedNodes = normalizeCleanupAffectedNodes(message.affectedNodes);
        var allowedCodes = ["stale-plan", "invalid-plan-operation", "apply-rolled-back", "partial-apply"];
        var validFailure = message.ok === false
          && allowedCodes.indexOf(message.errorCode) !== -1
          && typeof message.preflightComplete === "boolean"
          && typeof message.documentChanged === "boolean"
          && typeof message.rolledBack === "boolean"
          && affectedNodes !== null
          && (message.errorCode !== "partial-apply" || affectedNodes.length > 0)
          && (message.errorCode !== "apply-rolled-back" || (message.rolledBack && !message.documentChanged && affectedNodes.length === 0))
          && (message.errorCode !== "partial-apply"
            || (message.preflightComplete && !message.rolledBack && message.documentChanged))
          && (["stale-plan", "invalid-plan-operation"].indexOf(message.errorCode) === -1
            || (!message.preflightComplete && !message.rolledBack && !message.documentChanged && affectedNodes.length === 0));
        if (!validFailure) {
          cleanupSession.applyInFlight = false;
          if (activeView === "cleanup") renderCleanupView();
          setFailure("cleanup-apply-result", COPY.cleanupInvalidApplyResult, null, "invalid-cleanup-apply-result");
          setStatus(COPY.cleanupInvalidApplyResult, "error");
          return;
        }
        attempt.failureReport = {
          errorCode: message.errorCode,
          documentChanged: message.documentChanged,
          rolledBack: message.rolledBack,
          affectedNodes: affectedNodes,
        };
        submitCleanupFailure();
      }

      async function loadWorkflowTasks(force) {
        if (!pluginContext || !pluginContext.fileKey || !reviewerKey || !featureEnabled("workflow") || workflowSession.loading) return;
        if (workflowSession.loaded && !force) return;
        workflowSession.loading = true;
        if (activeView === "workflow") renderWorkflowView();
        setStatus(COPY.workflowLoadingTasks);
        var response;
        try {
          response = await fetch(coordinatorUrl + "/v1/automation/tasks?fileKey=" + encodeURIComponent(pluginContext.fileKey), {
            method: "GET",
            headers: { Accept: "application/json", Authorization: "Bearer " + reviewerKey },
          });
        } catch (error) {
          workflowSession.loading = false;
          if (activeView === "workflow") renderWorkflowView();
          setFailure("workflow-tasks", COPY.workflowTaskFailure, "workflow-tasks", COPY.diagnosticNetwork);
          setStatus(COPY.workflowTaskFailure, "error");
          return;
        }
        if (response.status === 401) {
          reviewerKey = "";
          workflowSession.loading = false;
          renderLogin(COPY.invalidAccessCode);
          return;
        }
        if (!response.ok) {
          workflowSession.loading = false;
          if (activeView === "workflow") renderWorkflowView();
          setFailure("workflow-tasks", COPY.workflowTaskFailure, "workflow-tasks", copy("diagnosticHttp", { status: response.status }));
          setStatus(COPY.workflowTaskFailure, "error");
          return;
        }
        var payload = await response.json();
        workflowSession.tasks = payload && Array.isArray(payload.items) ? payload.items.filter(function (task) {
          return task && typeof task.id === "string" && typeof task.status === "string" && task.taskType === "figma-cleanup";
        }) : [];
        workflowSession.loaded = true;
        workflowSession.loading = false;
        workflowOverview = normalizeWorkflowOverview(payload && payload.workflowOverview);
        if (cleanupSession.task) {
          workflowSession.tasks.forEach(function (task) {
            if (task.id === cleanupSession.task.id && !cleanupSession.task.plan) cleanupSession.task = task;
          });
        }
        clearFailure();
        if (activeView === "workflow") renderWorkflowView();
        setStatus("");
      }

      function setStatus(message, tone) {
        liveStatus.textContent = message || "";
        if (tone) liveStatus.dataset.tone = tone;
        else delete liveStatus.dataset.tone;
      }

      function clearFailure(kind) {
        if (kind && failureKind !== kind) return;
        failureKind = null;
        failureRetry = null;
        failurePanel.innerHTML = "";
      }

      function setFailure(kind, summary, retryAction, diagnostic) {
        failureKind = kind;
        failureRetry = retryAction || null;
        failurePanel.innerHTML = [
          '<p data-kind="' + escapeHtml(kind) + '">' + escapeHtml(summary) + '</p>',
          retryAction ? '<button id="retryFailureButton" type="button">' + escapeHtml(COPY.retry) + '</button>' : '',
          diagnostic
            ? '<details class="technical-details"><summary>' + escapeHtml(COPY.technicalInfo) + '</summary><code>' + escapeHtml(diagnostic) + '</code></details>'
            : '',
        ].join("");
        if (retryAction) document.getElementById("retryFailureButton").addEventListener("click", retryLastFailure);
      }

      function retryLastFailure() {
        var action = failureRetry;
        clearFailure();
        if (action === "context") loadAuthenticatedContext();
        else if (action === "pending") loadPendingReviews();
        else if (action === "decision") submitDecision();
        else if (action === "focus") focusActiveItem();
        else if (action === "cleanup-create") startCleanupAnalysis();
        else if (action === "cleanup-detail" && cleanupSession.task) loadCleanupTaskDetail(cleanupSession.task.id);
        else if (action === "cleanup-apply-intent") beginCleanupApply();
        else if (action === "cleanup-complete") submitCleanupCompletion();
        else if (action === "cleanup-fail") submitCleanupFailure();
        else if (action === "workflow-tasks") loadWorkflowTasks(true);
      }

      function resetReviewState() {
        pendingItems = [];
        workflowOverview = null;
        activeIndex = 0;
        detailsExpanded = false;
        alternativesExpanded = false;
        selectedDecision = null;
        submissionInFlight = false;
        reviewLoaded = false;
      }

      function resetAutomationState() {
        cleanupSession = {
          task: null,
          activeTaskId: null,
          tasks: [],
          captures: [],
          rejected: [],
          scopeSummary: null,
          captureState: "idle",
          captureError: null,
          scanState: "idle",
          scanCandidates: [],
          scanSelectedIds: [],
          scanTruncated: false,
          submissionInFlight: false,
          detailInFlight: false,
          applyInFlight: false,
          applyAttempt: null,
          failureContext: null,
          completionSummary: null,
          analysisGeneration: 0,
          selectedOperationIds: [],
          selectionRevision: null,
          detailsExpanded: false,
          confirmationOpen: false,
        };
        workflowSession = { tasks: [], loaded: false, loading: false };
      }

      function renderLogin(message) {
        activeView = "login";
        resetReviewState();
        clearFailure();
        appState.innerHTML = [
          '<form class="login-form" id="loginForm">',
          '<div class="login-heading"><h2>' + escapeHtml(COPY.loginTitle) + '</h2><p>' + escapeHtml(COPY.loginBody) + '</p></div>',
          '<label for="reviewerKeyInput">' + escapeHtml(COPY.accessCodeLabel),
          '<input id="reviewerKeyInput" name="reviewerKey" type="password" autocomplete="off" required aria-describedby="accessCodeHelper" />',
          '<span class="field-helper" id="accessCodeHelper">' + escapeHtml(COPY.accessCodeHelper) + '</span></label>',
          '<button type="submit">' + escapeHtml(COPY.startReview) + '</button>',
          '</form>',
        ].join("");
        if (message) setStatus(message, "error");
        else setStatus("");
        var form = document.getElementById("loginForm");
        var input = document.getElementById("reviewerKeyInput");
        form.addEventListener("submit", function (event) {
          event.preventDefault();
          var nextKey = input.value.trim();
          if (!nextKey) {
            setStatus(COPY.missingAccessCode, "error");
            return;
          }
          reviewerKey = nextKey;
          input.value = "";
          loadAuthenticatedContext();
        });
        input.focus();
      }

      function activeItem() {
        return pendingItems.length > 0 ? pendingItems[activeIndex] : null;
      }

      function renderUnsupportedProject(diagnostic) {
        projectContext = null;
        reviewerContext.textContent = "";
        appState.innerHTML = '<section class="empty-state"><h2>' + escapeHtml(COPY.unsupportedProjectTitle) + '</h2><p>'
          + escapeHtml(COPY.unsupportedProjectBody) + '</p><details class="technical-details"><summary>'
          + escapeHtml(COPY.technicalInfo) + '</summary><code>' + escapeHtml(diagnostic || "unsupported-project")
          + '</code></details></section>';
        clearFailure();
        setStatus(COPY.noRequestSent, "error");
      }

      async function loadAuthenticatedContext() {
        if (!pluginContext || !pluginContext.fileKey || !reviewerKey) return;
        setStatus(COPY.loadingContext);
        var response;
        try {
          response = await fetch(coordinatorUrl + "/v1/plugin/context?fileKey=" + encodeURIComponent(pluginContext.fileKey), {
            method: "GET",
            headers: {
              Accept: "application/json",
              Authorization: "Bearer " + reviewerKey,
            },
          });
        } catch (error) {
          setFailure("network", COPY.projectContextFailure, "context", COPY.diagnosticNetwork);
          setStatus(COPY.projectContextFailure, "error");
          return;
        }
        var payload = null;
        try {
          payload = await response.json();
        } catch (error) {
          payload = null;
        }
        var errorCode = stableErrorCode(payload);
        if (response.status === 401) {
          reviewerKey = "";
          projectContext = null;
          renderLogin(COPY.invalidAccessCode);
          return;
        }
        if (response.status === 404 && errorCode === "unsupported-project") {
          renderUnsupportedProject(errorCode);
          return;
        }
        if (response.status === 403 && errorCode === "unauthorized-project") {
          reviewerKey = "";
          projectContext = null;
          renderLogin(COPY.projectAccessDenied);
          return;
        }
        if (response.status === 404 && errorCode === "not-found") {
          setFailure("context-outdated", COPY.projectContextOutdated, "context", errorCode);
          setStatus(COPY.projectContextOutdated, "error");
          return;
        }
        if (!response.ok) {
          var diagnostic = errorCode || copy("diagnosticHttp", { status: response.status });
          setFailure(response.status >= 500 ? "server" : "request", COPY.projectContextFailure, "context", diagnostic);
          setStatus(COPY.projectContextFailure, "error");
          return;
        }
        if (!validProjectContext(payload)) {
          setFailure("invalid-context", COPY.projectContextFailure, "context", "invalid-project-context");
          setStatus(COPY.projectContextFailure, "error");
          return;
        }
        projectContext = payload;
        reviewerContext.textContent = copy("projectContext", { name: projectContext.project.displayName });
        clearFailure();
        setStatus("");
        renderHome();
      }

      function displayNameParts(item) {
        var fullName = item && typeof item.displayName === "string" ? item.displayName.trim() : "";
        var segments = fullName.split("/").map(function (segment) { return segment.trim(); }).filter(Boolean);
        return {
          title: segments.length > 0 ? segments[segments.length - 1] : COPY.unnamedComponent,
          breadcrumb: segments.length > 1 ? segments.slice(0, -1).join(COPY.breadcrumbSeparator) : "",
        };
      }

      function normalizeWorkflowOverview(value) {
        var states = ["needsReview", "attention", "active", "waiting", "complete"];
        var countKeys = ["completed", "active", "needsReview", "attention", "waiting"];
        if (!value || states.indexOf(value.state) === -1 || !value.counts) return null;
        var counts = {};
        for (var index = 0; index < countKeys.length; index += 1) {
          var key = countKeys[index];
          if (!Number.isInteger(value.counts[key]) || value.counts[key] < 0) return null;
          counts[key] = value.counts[key];
        }
        if (!Array.isArray(value.attentionItems)) return null;
        var attentionItems = [];
        for (var itemIndex = 0; itemIndex < value.attentionItems.length && attentionItems.length < 3; itemIndex += 1) {
          var item = value.attentionItems[itemIndex];
          if (!item || typeof item.displayName !== "string" || !item.displayName.trim()) continue;
          if (item.reason !== "blocked" && item.reason !== "runner-exhausted") continue;
          attentionItems.push({ displayName: item.displayName.trim(), reason: item.reason });
        }
        return { state: value.state, counts: counts, attentionItems: attentionItems };
      }

      function renderWorkflowOverview() {
        if (!workflowOverview) {
          return '<section class="workflow-overview" aria-label="' + escapeHtml(COPY.workflowTitle) + '">'
            + '<div class="workflow-heading"><h3>' + escapeHtml(COPY.workflowTitle) + '</h3></div>'
            + '<p>' + escapeHtml(COPY.workflowUnavailable) + '</p></section>';
        }
        var countEntries = [
          ["completed", COPY.workflowCompleted],
          ["active", COPY.workflowActive],
          ["needsReview", COPY.workflowNeedsReview],
          ["attention", COPY.workflowAttention],
          ["waiting", COPY.workflowWaiting],
        ];
        return [
          '<section class="workflow-overview" aria-label="' + escapeHtml(COPY.workflowTitle) + '">',
          '<div class="workflow-heading"><h3>' + escapeHtml(COPY.workflowTitle) + '</h3><p>' + escapeHtml(COPY.workflowUpdated) + '</p></div>',
          '<div class="workflow-counts">',
          countEntries.map(function (entry) {
            return '<div class="workflow-count"><strong>' + escapeHtml(workflowOverview.counts[entry[0]]) + '</strong><span>' + escapeHtml(entry[1]) + '</span></div>';
          }).join(""),
          '</div></section>',
        ].join("");
      }

      function renderAttentionItems() {
        if (!workflowOverview || workflowOverview.state !== "attention") return "";
        return '<div class="attention-list">' + workflowOverview.attentionItems.map(function (item) {
          var name = displayNameParts(item);
          var reason = item.reason === "blocked" ? COPY.attentionBlocked : COPY.attentionExhausted;
          return '<div class="attention-item">'
            + (name.breadcrumb ? '<p class="breadcrumb">' + escapeHtml(name.breadcrumb) + '</p>' : '')
            + '<strong>' + escapeHtml(name.title) + '</strong><p>' + escapeHtml(reason) + '</p></div>';
        }).join("") + '</div>';
      }

      function focusActiveItem() {
        var item = activeItem();
        if (!item) return;
        postToMain({ type: "focus-node", nodeId: item.nodeId });
      }

      function handleFocusResult(message) {
        if (message.ok) {
          clearFailure("focus");
          return;
        }
        var summaryKey = message.errorCode === "node-not-found"
          ? "focusNodeMissing"
          : message.errorCode === "page-load-failed"
            ? "focusPageFailed"
            : "focusFailed";
        setFailure("focus", COPY[summaryKey], "focus", message.errorCode || "focus-failed");
        setStatus(COPY[summaryKey], "error");
      }

      function moveActiveItem(delta) {
        if (pendingItems.length === 0) return;
        var nextIndex = Math.max(0, Math.min(pendingItems.length - 1, activeIndex + delta));
        if (nextIndex === activeIndex) return;
        activeIndex = nextIndex;
        detailsExpanded = false;
        alternativesExpanded = false;
        selectedDecision = null;
        submissionInFlight = false;
        renderPendingItem();
        focusActiveItem();
      }

      function renderDetailList(titleKey, values) {
        var items = Array.isArray(values) ? values.slice(0, 3) : [];
        if (items.length === 0) return "";
        return '<section><h3>' + escapeHtml(COPY[titleKey]) + '</h3><ul>'
          + items.map(function (value) { return '<li>' + escapeHtml(value) + '</li>'; }).join("")
          + '</ul></section>';
      }

      function renderRecommendation(item) {
        var recommendation = item.recommendation;
        if (!recommendation || !DECISION_LABELS[recommendation.decision]) return "";
        var details = detailsExpanded
          ? '<div class="details" id="recommendationDetails">'
            + renderDetailList("samePoints", recommendation.sameAs)
            + renderDetailList("differences", recommendation.differences)
            + renderDetailList("similarComponents", recommendation.similarComponents)
            + '</div>'
          : "";
        return [
          '<section class="recommendation">',
          '<div class="recommendation-heading"><span class="recommendation-chip">' + escapeHtml(COPY.recommendationChip) + '</span>',
          '<span class="recommendation-label">' + escapeHtml(DECISION_LABELS[recommendation.decision]) + '</span></div>',
          '<p class="recommendation-reason">' + escapeHtml(recommendation.reason || "") + '</p>',
          '<button class="disclosure-button" id="detailsButton" type="button" aria-controls="recommendationDetails" aria-expanded="' + detailsExpanded + '">'
            + escapeHtml(detailsExpanded ? COPY.hideDetails : COPY.viewDetails) + '</button>',
          details,
          '<button id="adoptRecommendationButton" type="button">' + escapeHtml(COPY.adoptRecommendation) + '</button>',
          '</section>',
        ].join("");
      }

      function renderDecisionActions(item) {
        var hasRecommendation = Boolean(item.recommendation && DECISION_LABELS[item.recommendation.decision]);
        if (hasRecommendation && !alternativesExpanded) {
          return '<button class="quiet-button" id="alternativesButton" type="button" aria-controls="reviewDecisionActions" aria-expanded="false">'
            + escapeHtml(COPY.chooseOther) + '</button>';
        }
        var heading = hasRecommendation
          ? '<button class="quiet-button" id="alternativesButton" type="button" aria-controls="reviewDecisionActions" aria-expanded="true">' + escapeHtml(COPY.hideOther) + '</button>'
          : '<h3>' + escapeHtml(COPY.chooseMethod) + '</h3>';
        return [
          '<section class="alternative-section">',
          heading,
          '<div class="decision-actions" id="reviewDecisionActions" role="group" aria-label="' + escapeHtml(COPY.alternativeAria) + '">',
          '<button class="secondary" id="mergeDecisionButton" type="button"' + (item.existingComponentId ? '' : ' disabled') + '>' + escapeHtml(COPY.decisionMerge) + '</button>',
          '<button class="secondary" id="variantDecisionButton" type="button"' + (item.existingComponentId ? '' : ' disabled') + '>' + escapeHtml(COPY.decisionVariant) + '</button>',
          '<button class="secondary" id="distinctDecisionButton" type="button">' + escapeHtml(COPY.decisionDistinct) + '</button>',
          item.existingComponentId ? '' : '<p class="missing-target">' + escapeHtml(COPY.missingTarget) + '</p>',
          '</div></section>',
        ].join("");
      }

      function selectDecision(decision, source) {
        var item = activeItem();
        if (!item || !DECISION_LABELS[decision]) return;
        if ((decision === "merge" || decision === "make-variant") && !item.existingComponentId) {
          setStatus(COPY.missingTarget, "error");
          return;
        }
        selectedDecision = {
          decision: decision,
          label: DECISION_LABELS[decision],
          source: source === "recommendation" ? "recommendation" : "explicit",
          existingComponentId: decision === "keep-distinct" ? null : item.existingComponentId,
        };
        setStatus(copy("selectedDecision", { action: DECISION_LABELS[decision] }));
        renderPendingItem();
        var confirmButton = document.getElementById("confirmDecisionButton");
        if (confirmButton) confirmButton.focus();
      }

      function adoptRecommendation() {
        var item = activeItem();
        if (!item || !item.recommendation) return;
        selectDecision(item.recommendation.decision, "recommendation");
      }

      function renderConfirmation(item) {
        if (!selectedDecision) return "";
        var name = displayNameParts(item).title;
        var confirmLabel = selectedDecision.source === "recommendation" ? COPY.confirmAdopt : COPY.confirmChoice;
        return [
          '<section class="confirmation" role="dialog" aria-labelledby="reviewConfirmationHeading">',
          '<div class="confirmation-copy"><h3 id="reviewConfirmationHeading">' + escapeHtml(COPY.confirmationTitle) + '</h3>',
          '<p>' + escapeHtml(copy("confirmationAction", { action: selectedDecision.label })) + '</p>',
          '<p>' + escapeHtml(copy("confirmationComponent", { component: name })) + '</p></div>',
          '<div class="confirmation-actions">',
          '<button class="cancel-button" id="cancelDecisionButton" type="button"' + (submissionInFlight ? ' disabled' : '') + '>' + escapeHtml(COPY.returnEdit) + '</button>',
          '<button id="confirmDecisionButton" type="button"' + (submissionInFlight ? ' disabled' : '') + '>' + escapeHtml(confirmLabel) + '</button>',
          '</div></section>',
        ].join("");
      }

      function cancelDecision() {
        if (submissionInFlight) return;
        var cancelledDecision = selectedDecision;
        selectedDecision = null;
        renderPendingItem();
        var returnTargetId = cancelledDecision && cancelledDecision.source === "recommendation"
          ? "adoptRecommendationButton"
          : (cancelledDecision && cancelledDecision.decision === "merge"
            ? "mergeDecisionButton"
            : (cancelledDecision && cancelledDecision.decision === "make-variant"
              ? "variantDecisionButton"
              : "distinctDecisionButton"));
        var returnTarget = document.getElementById(returnTargetId);
        if (returnTarget) returnTarget.focus();
        setStatus(COPY.cancelled);
      }

      async function submitDecision() {
        var item = activeItem();
        if (!item || !selectedDecision || submissionInFlight || !reviewerKey || !pluginContext) return;
        submissionInFlight = true;
        renderPendingItem();
        setStatus(COPY.submittingDecision);
        var payload = {
          fileKey: pluginContext.fileKey,
          nodeId: item.nodeId,
          decision: selectedDecision.decision,
          evidenceReference: "figma-plugin:" + pluginContext.pluginId + ":" + sessionId + ":" + item.nodeId,
        };
        if (selectedDecision.existingComponentId) payload.existingComponentId = selectedDecision.existingComponentId;
        var response;
        try {
          response = await fetch(coordinatorUrl + "/v1/reviews", {
            method: "POST",
            headers: {
              Accept: "application/json",
              Authorization: "Bearer " + reviewerKey,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });
        } catch (error) {
          submissionInFlight = false;
          renderPendingItem();
          setFailure("network", COPY.decisionNetworkFailure, "decision", COPY.diagnosticNetwork);
          setStatus(COPY.decisionNetworkFailure, "error");
          return;
        }
        if (response.status === 401) {
          reviewerKey = "";
          submissionInFlight = false;
          clearFailure();
          renderLogin(COPY.invalidAccessCode);
          return;
        }
        if (!response.ok) {
          submissionInFlight = false;
          renderPendingItem();
          var decisionFailure = response.status >= 500 ? COPY.decisionServerFailure : COPY.decisionRequestFailure;
          setFailure(response.status >= 500 ? "server" : "request", decisionFailure, "decision", copy("diagnosticHttp", { status: response.status }));
          setStatus(decisionFailure, "error");
          return;
        }
        var result = await response.json();
        var completedLabel = selectedDecision.label;
        submissionInFlight = false;
        selectedDecision = null;
        detailsExpanded = false;
        alternativesExpanded = false;
        if (result.alreadyDecided) {
          var existing = result.existing || {};
          await loadPendingReviews();
          var timeLabel = existing.createdAt ? copy("decidedTime", { time: existing.createdAt }) : "";
          var alreadyDecidedMessage = copy("firstWrite", {
            action: DECISION_LABELS[existing.decision] || COPY.unknownDecision,
            reviewer: existing.reviewerId || COPY.unknownReviewer,
            time: timeLabel,
          });
          setFailure("first-write", alreadyDecidedMessage, "pending", "already-decided");
          setStatus(alreadyDecidedMessage);
          return;
        }
        await loadPendingReviews();
        setStatus(copy("submittedDecision", { action: completedLabel }));
      }

      function renderEmptyState() {
        activeView = "review";
        var title = COPY.noReviewTitle;
        var body = COPY.workflowUnavailable;
        var items = "";
        if (workflowOverview) {
          if (workflowOverview.state === "complete") {
            title = COPY.completeTitle;
            body = COPY.completeBody;
          } else if (workflowOverview.state === "attention") {
            body = copy("attentionBody", { count: workflowOverview.counts.attention });
            items = renderAttentionItems();
          } else if (workflowOverview.state === "active") {
            body = COPY.activeBody;
          } else if (workflowOverview.state === "waiting") {
            body = COPY.waitingBody;
          }
        }
        appState.innerHTML = [
          '<section class="feature-view" data-view="review">',
          renderFeatureHeader(COPY.reviewTitle, COPY.reviewHelper),
          renderWorkflowOverview(),
          '<section class="empty-state"><h2>' + escapeHtml(title) + '</h2>',
          '<p>' + escapeHtml(body) + '</p>',
          items,
          '<button class="refresh-button" id="refreshButton" type="button">' + escapeHtml(COPY.refresh) + '</button></section></section>',
        ].join("");
        bindBackHome();
        document.getElementById("refreshButton").addEventListener("click", loadPendingReviews);
      }

      function renderPendingItem() {
        var item = activeItem();
        if (!item) {
          renderEmptyState();
          return;
        }
        activeView = "review";
        var name = displayNameParts(item);
        appState.innerHTML = [
          '<section class="feature-view" data-view="review">',
          renderFeatureHeader(COPY.reviewTitle, COPY.reviewHelper),
          renderWorkflowOverview(),
          '<article class="review-card">',
          '<div class="progress-row"><span class="progress">' + escapeHtml(copy("progress", { current: activeIndex + 1, total: pendingItems.length })) + '</span></div>',
          '<div class="component-heading">',
          name.breadcrumb ? '<p class="breadcrumb">' + escapeHtml(name.breadcrumb) + '</p>' : '',
          '<h2>' + escapeHtml(name.title) + '</h2>',
          '<p class="similar-hint">' + escapeHtml(item.existingComponentId ? COPY.similarAvailable : COPY.similarUnavailable) + '</p>',
          '</div>',
          renderRecommendation(item),
          renderDecisionActions(item),
          renderConfirmation(item),
          '<nav class="navigation" aria-label="' + escapeHtml(COPY.navigationAria) + '">',
          '<button id="previousButton" type="button"' + (activeIndex === 0 ? ' disabled' : '') + '>' + escapeHtml(COPY.previous) + '</button>',
          '<button id="nextButton" type="button"' + (activeIndex === pendingItems.length - 1 ? ' disabled' : '') + '>' + escapeHtml(COPY.next) + '</button>',
          '</nav>',
          '<div class="footer-actions"><button class="refresh-button" id="refreshButton" type="button">' + escapeHtml(COPY.refresh) + '</button></div>',
          '</article></section>',
        ].join("");
        bindBackHome();
        var detailsButton = document.getElementById("detailsButton");
        if (item.recommendation && detailsButton) {
          detailsButton.addEventListener("click", function () {
            detailsExpanded = !detailsExpanded;
            renderPendingItem();
            var nextDetailsButton = document.getElementById("detailsButton");
            if (nextDetailsButton) nextDetailsButton.focus();
          });
          document.getElementById("adoptRecommendationButton").addEventListener("click", adoptRecommendation);
        }
        var alternativesButton = document.getElementById("alternativesButton");
        if (alternativesButton) {
          alternativesButton.addEventListener("click", function () {
            alternativesExpanded = !alternativesExpanded;
            renderPendingItem();
            var nextAlternativesButton = document.getElementById("alternativesButton");
            if (nextAlternativesButton) nextAlternativesButton.focus();
          });
        }
        var mergeButton = document.getElementById("mergeDecisionButton");
        var variantButton = document.getElementById("variantDecisionButton");
        var distinctButton = document.getElementById("distinctDecisionButton");
        if (mergeButton) mergeButton.addEventListener("click", function () { selectDecision("merge", "explicit"); });
        if (variantButton) variantButton.addEventListener("click", function () { selectDecision("make-variant", "explicit"); });
        if (distinctButton) distinctButton.addEventListener("click", function () { selectDecision("keep-distinct", "explicit"); });
        if (selectedDecision) {
          document.getElementById("cancelDecisionButton").addEventListener("click", cancelDecision);
          document.getElementById("confirmDecisionButton").addEventListener("click", submitDecision);
        }
        document.getElementById("previousButton").addEventListener("click", function () { moveActiveItem(-1); });
        document.getElementById("nextButton").addEventListener("click", function () { moveActiveItem(1); });
        document.getElementById("refreshButton").addEventListener("click", loadPendingReviews);
      }

      async function loadPendingReviews() {
        if (!pluginContext || !pluginContext.fileKey || !reviewerKey || !projectContext || !featureEnabled("review")) return;
        setStatus(COPY.loadingReviews);
        var requestUrl = coordinatorUrl + "/v1/reviews/pending?fileKey=" + encodeURIComponent(pluginContext.fileKey);
        var response;
        try {
          response = await fetch(requestUrl, {
            method: "GET",
            headers: {
              Accept: "application/json",
              Authorization: "Bearer " + reviewerKey,
            },
          });
        } catch (error) {
          setFailure("network", COPY.pendingNetworkFailure, "pending", COPY.diagnosticNetwork);
          setStatus(COPY.pendingNetworkFailure, "error");
          return;
        }
        if (response.status === 401) {
          reviewerKey = "";
          clearFailure();
          renderLogin(COPY.invalidAccessCode);
          return;
        }
        if (response.status === 403) {
          reviewerKey = "";
          clearFailure();
          renderLogin(COPY.noReviewPermission);
          return;
        }
        if (!response.ok) {
          var pendingFailure = response.status >= 500 ? COPY.pendingServerFailure : COPY.pendingRequestFailure;
          setFailure(response.status >= 500 ? "server" : "request", pendingFailure, "pending", copy("diagnosticHttp", { status: response.status }));
          setStatus(pendingFailure, "error");
          return;
        }
        var payload = await response.json();
        pendingItems = Array.isArray(payload.items) ? payload.items : [];
        workflowOverview = normalizeWorkflowOverview(payload.workflowOverview);
        activeIndex = 0;
        detailsExpanded = false;
        alternativesExpanded = false;
        selectedDecision = null;
        submissionInFlight = false;
        reviewLoaded = true;
        clearFailure();
        postToMain({ type: "save-coordinator-url", coordinatorUrl: coordinatorUrl });
        if (activeView === "review") {
          renderPendingItem();
          focusActiveItem();
        }
        setStatus(copy("loadedReviews", { count: pendingItems.length }));
      }

      window.onmessage = function (event) {
        var message = event.data && event.data.pluginMessage;
        if (!message || typeof message.type !== "string") return;
        if (message.type === "focus-result") {
          handleFocusResult(message);
          return;
        }
        if (message.type === "cleanup-scopes-result") {
          handleCleanupScopesResult(message);
          return;
        }
        if (message.type === "ready-for-dev-scan-result") {
          handleReadyForDevScanResult(message);
          return;
        }
        if (message.type === "cleanup-validation-result") {
          handleCleanupValidationResult(message);
          return;
        }
        if (message.type === "cleanup-apply-result") {
          handleCleanupApplyResult(message);
          return;
        }
        if (message.type !== "plugin-context") return;
        pluginContext = message;
        projectContext = null;
        resetAutomationState();
        coordinatorUrl = message.coordinatorUrl === DEFAULT_COORDINATOR_URL
          ? message.coordinatorUrl
          : DEFAULT_COORDINATOR_URL;
        if (!message.fileKey) {
          reviewerContext.textContent = "";
          appState.innerHTML = '<section class="empty-state"><h2>' + escapeHtml(COPY.unsupportedTitle) + '</h2><p>'
            + escapeHtml(COPY.unsupportedBody) + '</p><details class="technical-details"><summary>' + escapeHtml(COPY.technicalInfo)
            + '</summary><code>' + escapeHtml(COPY.diagnosticUnsupported) + '</code></details></section>';
          clearFailure();
          setStatus(COPY.noRequestSent, "error");
          return;
        }
        reviewerContext.textContent = COPY.projectPending;
        renderLogin();
      };

      appTitle.textContent = COPY.appTitle;
      appSubtitle.textContent = COPY.appSubtitle;
      reviewerContext.textContent = COPY.loadingContext;
      appState.textContent = COPY.loadingContext;
    </script>
  </body>
</html>
