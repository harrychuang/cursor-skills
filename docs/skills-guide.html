<!DOCTYPE html>
<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor Skills 使用說明</title>
<style>
:root {
  --bg: #faf9f7;
  --surface: #ffffff;
  --ink: #16150f;
  --ink-2: #3b3830;
  --muted: #6c6759;
  --faint: #948f81;
  --rule: #e1ddd4;
  --rule-strong: #c4bfb2;
  --code-bg: #efece5;
  --bar: rgba(250, 249, 247, 0.88);

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
          "Hiragino Sans", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --measure: 44rem;
  --wide: 62rem;

  --w-body: 400;
  --w-strong: 600;
  --w-head: 650;
}

html[lang="ja"] {
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          "Yu Gothic", "Noto Sans JP", "Segoe UI", sans-serif;
}
html[lang="en"] {
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --bg: #121110;
    --surface: #1b1a18;
    --ink: #f0ede6;
    --ink-2: #cbc7bd;
    --muted: #97917f;
    --faint: #726d61;
    --rule: #302e2a;
    --rule-strong: #47443d;
    --code-bg: #24221f;
    --bar: rgba(18, 17, 16, 0.88);
  }
}

:root[data-theme="dark"] {
  --bg: #121110;
  --surface: #1b1a18;
  --ink: #f0ede6;
  --ink-2: #cbc7bd;
  --muted: #97917f;
  --faint: #726d61;
  --rule: #302e2a;
  --rule-strong: #47443d;
  --code-bg: #24221f;
  --bar: rgba(18, 17, 16, 0.88);
}

:root[data-theme="light"] {
  --bg: #faf9f7;
  --surface: #ffffff;
  --ink: #16150f;
  --ink-2: #3b3830;
  --muted: #6c6759;
  --faint: #948f81;
  --rule: #e1ddd4;
  --rule-strong: #c4bfb2;
  --code-bg: #efece5;
  --bar: rgba(250, 249, 247, 0.88);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 18px;
  font-weight: var(--w-body);
  line-height: 1.8;
  letter-spacing: 0.005em;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background-color .15s linear, color .15s linear;
}

.wrap {
  max-width: var(--wide);
  margin: 0 auto;
  padding: 0 clamp(1.25rem, 5vw, 3.5rem);
}

.col { max-width: var(--measure); }

a { color: inherit; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--ink); }

strong, b { font-weight: var(--w-strong); color: var(--ink); }

code, .mono { font-family: var(--mono); font-size: 0.85em; letter-spacing: 0; }

code {
  background: var(--code-bg);
  padding: 0.12em 0.42em;
  border-radius: 2px;
  font-weight: 500;
}

/* ---------- top bar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bar);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--rule);
}

.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 3.5rem;
  flex-wrap: wrap;
  padding-top: .5rem;
  padding-bottom: .5rem;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  overflow: hidden;
}

.seg button {
  appearance: none;
  border: 0;
  border-left: 1px solid var(--rule-strong);
  background: transparent;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  padding: 0.38rem 0.8rem;
  cursor: pointer;
  line-height: 1.5;
  transition: background-color .12s, color .12s;
  white-space: nowrap;
}

.seg button:first-child { border-left: 0; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }

/* ---------- header ---------- */

header.masthead {
  padding: clamp(4.5rem, 13vh, 9rem) 0 clamp(4rem, 10vh, 7rem);
  border-bottom: 1px solid var(--rule);
}

.eyebrow {
  font-family: var(--mono);
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--faint);
  margin: 0 0 2.5rem;
}

h1 {
  font-size: clamp(2.25rem, 5.6vw, 3.4rem);
  line-height: 1.24;
  letter-spacing: -0.018em;
  font-weight: var(--w-head);
  margin: 0 0 1.75rem;
  max-width: 21ch;
}

.lede {
  font-size: clamp(1.1rem, 2.1vw, 1.3rem);
  line-height: 1.78;
  font-weight: 400;
  color: var(--ink-2);
  margin: 0 0 2.5rem;
  max-width: 40rem;
}

.meta {
  font-family: var(--mono);
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--faint);
  letter-spacing: 0.06em;
}

/* ---------- toc ---------- */

nav.toc { padding: 3rem 0; border-bottom: 1px solid var(--rule); }

nav.toc ol {
  list-style: none; margin: 0; padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
  gap: 0.5rem 2.5rem;
}

nav.toc li { display: flex; gap: 0.9rem; align-items: baseline; }

nav.toc .n { font-family: var(--mono); font-size: 0.76rem; font-weight: 500; color: var(--faint); }
nav.toc a { text-decoration: none; color: var(--ink-2); font-size: 1rem; font-weight: 500; }
nav.toc a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

/* ---------- sections ---------- */

section { padding: clamp(4.5rem, 11vh, 8rem) 0; border-bottom: 1px solid var(--rule); }
section:last-of-type { border-bottom: none; }

.sec-num {
  font-family: var(--mono);
  font-size: 0.76rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  color: var(--faint);
  margin: 0 0 1.5rem;
}

h2 {
  font-size: clamp(1.65rem, 3.4vw, 2.15rem);
  line-height: 1.36;
  letter-spacing: -0.012em;
  font-weight: var(--w-head);
  margin: 0 0 1.5rem;
  max-width: 24ch;
}

h3 { font-size: 1.16rem; font-weight: var(--w-strong); line-height: 1.55; margin: 0 0 0.75rem; }

p { margin: 0 0 1.4rem; }
p:last-child { margin-bottom: 0; }

.intro { color: var(--ink-2); max-width: var(--measure); margin-bottom: 3.5rem; font-size: 1.05rem; }

/* ---------- pipeline ---------- */

.pipeline {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin: 0 0 2rem;
}

.stage { background: var(--bg); padding: 1.6rem 1.35rem 1.8rem; }

.stage .k {
  font-family: var(--mono); font-size: 0.72rem; font-weight: 500;
  letter-spacing: 0.14em; color: var(--faint); display: block; margin-bottom: 0.9rem;
}

.stage .t { font-size: 1.02rem; font-weight: var(--w-strong); margin-bottom: 0.7rem; line-height: 1.5; }

.stage .s {
  font-family: var(--mono); font-size: 0.78rem; font-weight: 500;
  line-height: 1.9; color: var(--muted); word-break: break-word;
}

.caption { font-size: 0.95rem; color: var(--muted); max-width: var(--measure); line-height: 1.75; }

/* ---------- table ---------- */

.tablewrap { overflow-x: auto; margin: 0 0 1.5rem; border: 1px solid var(--rule); }

table { border-collapse: collapse; width: 100%; min-width: 36rem; font-size: 1rem; }

th, td {
  text-align: left; vertical-align: top;
  padding: 1.05rem 1.3rem;
  border-bottom: 1px solid var(--rule);
  line-height: 1.7;
}

th {
  font-weight: var(--w-strong);
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}

tbody tr:last-child td { border-bottom: none; }
td.skill { white-space: nowrap; }
td.skill code { background: none; padding: 0; color: var(--ink); font-weight: 600; font-size: 0.92em; }

/* ---------- skill entries ---------- */

.group-label {
  font-family: var(--mono);
  font-size: 0.76rem;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--faint);
  padding-bottom: 0.9rem;
  border-bottom: 1px solid var(--rule-strong);
  margin: 4.5rem 0 0;
}

.group-label.first { margin-top: 0; }

.skill-entry {
  padding: 2.85rem 0;
  border-bottom: 1px solid var(--rule);
  display: grid;
  grid-template-columns: minmax(0, 16rem) minmax(0, 1fr);
  gap: 1rem 3rem;
}

@media (max-width: 48rem) {
  .skill-entry { grid-template-columns: 1fr; gap: 1.25rem; }
}

.skill-name {
  font-family: var(--mono);
  font-size: 0.98rem;
  font-weight: 600;
  line-height: 1.6;
  word-break: break-word;
}

.skill-tag {
  display: block;
  font-family: var(--sans);
  font-size: 0.86rem;
  font-weight: 500;
  color: var(--muted);
  margin-top: 0.5rem;
}

.skill-body > p:first-child { margin-top: 0; }

dl.facts {
  margin: 1.6rem 0 0;
  display: grid;
  grid-template-columns: 6rem minmax(0, 1fr);
  gap: 0.6rem 1.5rem;
  font-size: 0.98rem;
}

dl.facts dt {
  font-size: 0.84rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--faint);
  padding-top: 0.24rem;
}

dl.facts dd { margin: 0; color: var(--ink-2); line-height: 1.72; }
dl.facts dd code { font-size: 0.85em; }

@media (max-width: 32rem) {
  dl.facts { grid-template-columns: 1fr; gap: 0.15rem; }
  dl.facts dt { padding-top: 0.7rem; }
}

/* ---------- journeys ---------- */

.journey { padding: 3.25rem 0; border-bottom: 1px solid var(--rule); }
.journey:last-child { border-bottom: none; padding-bottom: 0; }

.journey-head { display: flex; gap: 1.5rem; align-items: baseline; margin-bottom: 1.25rem; }

.journey-num { font-family: var(--mono); font-size: 0.9rem; font-weight: 600; color: var(--faint); flex: none; }

.journey h3 { margin-bottom: 0.4rem; font-size: 1.28rem; }

.journey .situation { color: var(--ink-2); max-width: var(--measure); margin-bottom: 2rem; font-size: 1.02rem; }

ol.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; max-width: 48rem; }

ol.steps > li {
  counter-increment: step;
  position: relative;
  padding: 0 0 1.7rem 3.25rem;
  border-left: 1px solid var(--rule);
  margin-left: 0.5rem;
}

ol.steps > li::before {
  content: counter(step);
  position: absolute;
  left: -0.9rem;
  top: 0.2rem;
  width: 1.8rem; height: 1.8rem;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--rule-strong);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.76rem;
  font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}

ol.steps > li:last-child { border-left-color: transparent; padding-bottom: 0; }

ol.steps .step-title {
  font-weight: var(--w-strong);
  display: block;
  margin-bottom: 0.35rem;
  line-height: 1.6;
  font-size: 1.04rem;
}

ol.steps .step-title code { font-weight: 600; background: none; padding: 0; font-size: 0.9em; }
ol.steps p { font-size: 1rem; color: var(--ink-2); margin: 0 0 0.55rem; }
ol.steps p:last-child { margin-bottom: 0; }

.outcome {
  margin-top: 1.85rem;
  padding: 1.25rem 1.5rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  font-size: 0.99rem;
  color: var(--ink-2);
  max-width: 48rem;
}

.outcome b {
  font-weight: 600;
  color: var(--ink);
  font-size: 0.82rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 0.45rem;
}

/* ---------- rules / pitfalls ---------- */

ol.rules { list-style: none; margin: 0; padding: 0; max-width: 50rem; counter-reset: rule; }

ol.rules > li {
  counter-increment: rule;
  display: grid;
  grid-template-columns: 2.75rem minmax(0, 1fr);
  gap: 1.5rem;
  padding: 1.7rem 0;
  border-bottom: 1px solid var(--rule);
}

ol.rules > li:last-child { border-bottom: none; }

ol.rules > li::before {
  content: counter(rule, decimal-leading-zero);
  font-family: var(--mono);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--faint);
  padding-top: 0.32rem;
}

ol.rules b { display: block; font-weight: var(--w-strong); margin-bottom: 0.35rem; font-size: 1.06rem; }
ol.rules span { color: var(--ink-2); font-size: 1rem; }

.pitfall { padding: 1.7rem 0; border-bottom: 1px solid var(--rule); max-width: 50rem; }
.pitfall:last-child { border-bottom: none; }

.pitfall .bad, .pitfall .good {
  display: grid;
  grid-template-columns: 4rem minmax(0, 1fr);
  gap: 1rem;
  font-size: 1rem;
  line-height: 1.72;
}

.pitfall .bad { margin-bottom: 0.55rem; }

.pitfall .lbl {
  font-family: var(--mono);
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--faint);
  padding-top: 0.3rem;
}

.pitfall .bad div:last-child { color: var(--ink); font-weight: 500; }
.pitfall .good div:last-child { color: var(--ink-2); }

/* ---------- install ---------- */

pre {
  background: var(--code-bg);
  border: 1px solid var(--rule);
  padding: 1.3rem 1.45rem;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 0.88rem;
  font-weight: 500;
  line-height: 1.85;
  margin: 0 0 1.5rem;
  color: var(--ink-2);
}

pre code { background: none; padding: 0; font-size: 1em; }

.examples { color: var(--muted); font-size: 1rem; }

footer {
  padding: 5rem 0 7rem;
  border-top: 1px solid var(--rule);
  color: var(--faint);
  font-size: 0.95rem;
}

footer p { max-width: var(--measure); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}
</style>
</head>

          { t: '<code>figma-m3-variables</code> — settle the Figma-side Variables first', p: ['If Variables already exist, run Workflow C to audit them (is the layer naming right, are alias directions correct, are scopes set). If there are none, run Workflow B to build the three tiers from scratch.', 'Then use Workflow E to batch-bind them to existing components. By default it gives you a dry-run plan first and only writes after you confirm.'] },
          { t: '<code>design-system-extractor</code> — extract Figma into a spec package', p: ['Give it the Figma URL. With Figma MCP available it can read structured layout, variables, and component names — the highest-fidelity input source available.', 'Pay attention to the <strong>Figma MCP handoff</strong> it produces: file key, node id, suggested MCP calls. The next step uses these directly, so do not let them go blank.'] },
          { t: '<code>ds-to-storybook</code> — consult the original node while implementing', p: ['It uses the handoff information from the previous step to read the original node’s design context and screenshot through Figma MCP, instead of guessing from the spec text.', 'It also installs the Figma export addon so Storybook components can be exported back into Figma.'] },
          { t: '<code>ui-visual-parity</code> — finish against Figma exports', p: ['Use frames exported from Figma as reference screenshots for a final parity pass.'] }
        ],
        outcome: 'Figma Variables and CSS tokens aligned under the same Ref → Sys → Comp hierarchy, with every component keeping a traceable path back to its original Figma node.'
      },
      {
        n: 'C', h3: 'An existing project has drifted and needs a design system',
        situation: 'The project has been running a while and is full of hardcoded colours and copy-pasted components. You cannot rewrite it, so you converge while maintaining. Do <strong>not</strong> use <code>create-design-workspace</code> on this path.',
        steps: [
          { t: '<code>design-system-extractor</code> — extract from your own project', p: ['Use the existing project folder as the input source. It inspects the rendered UI, current CSS, Storybook, and components to produce the design system you are <em>actually</em> using — not the one you think you are.', 'The value is in the component inventory: it surfaces which components are duplicates and which colours differ by 2% yet exist separately.'] },
          { t: '<code>design-system-governance</code> — stop the bleeding today', p: ['Let it scan the project to learn the existing conventions first. From then on, every new piece of UI runs into the two gates. The old mess gets cleaned gradually, but at least it stops growing.'] },
          { t: '<code>ds-to-storybook</code> — converge one batch at a time', p: ['Use its component queue to fold scattered implementations into shared components in dependency order. It prefers reusing or extending an existing component over adding a new one.'] },
          { t: '<code>ui-visual-parity</code> — confirm convergence broke nothing', p: ['Run it after each batch. Its regression guardrail checks representative call sites and stories before you change a shared default, so the change does not leak into unrelated screens.'] }
        ],
        outcome: 'Design-system documentation that honestly reflects reality, a gate that prevents further decay, and a convergence queue you can push forward gradually.'
      },
      {
        n: 'D', h3: 'Validate a product idea before committing',
        situation: 'You have a feature idea and want something clickable to show people before deciding whether to invest. This is an independent branch — no design system needed first.',
        steps: [
          { t: 'Decide up front whether you need the flow diagram', p: ['Clickable screens only → <code>storybook-product-prototype</code>. Also need a diagram for meetings that imports into Figma → <code>prototype-storybook-flow</code>. Their docs and data rules are identical; the difference is the viewer and the export.'] },
          { t: 'Let it ask one product question at a time', p: ['It will not open files immediately. It first confirms the primary user, entry route, required branch states, which external systems stay mocked, and the acceptance criteria. Answering those is itself the work of clarifying the product.'] },
          { t: 'Docs before UI, flow before screens', p: ['The order is fixed: six docs → flow definition (routes, nodes, transitions) → deterministic fixtures → and only then React. That order is what makes the prototype a product flow rather than a few static screens.'] },
          { t: 'Validate, then decide whether to join the main line', p: ['If the prototype is worth pursuing, hand its screenshots to <code>design-system-extractor</code> and you rejoin Journey A. Do not promote prototype CSS into production implementation.'] }
        ],
        outcome: 'A clickable Storybook prototype plus product documentation complete enough for someone else to take over. If the idea gets killed, you lost a few hours — and the docs record why.'
      },
      {
        n: 'E', h3: 'Everyday maintenance: one screen, one component',
        situation: 'You do not need the whole pipeline every time. Most day-to-day work needs one or two skills.',
        steps: [
          { t: 'Screen does not match the design → <code>ui-visual-parity</code> alone', p: ['Just say "this screenshot does not match <code>/dashboard</code>, fix it". It finds the implementation file, renders the screen, compares region by region, and gives you a drift table before touching anything.'] },
          { t: 'Adding a new component → build on <code>design-system-governance</code>', p: ['It forces two confirmations first: can an existing component satisfy this, and do the required tokens exist? Only after both pass does writing start — and afterwards you owe Default / Hover / FocusVisible / Disabled stories.'] },
          { t: 'Component is already in the inventory → add <code>ds-to-storybook</code>', p: ['If the component is marked <code>planned</code> in <code>COMPONENT_INVENTORY.md</code>, run a single-component pass. It fills in the spec, original source, token contract, and story in one go.'] },
          { t: 'New component appeared in Figma → <code>figma-m3-variables</code> Workflow A', p: ['Hand it the new component’s node and apply the existing comp tokens. It presents a binding plan before executing and verifies with a screenshot afterwards.'] }
        ],
        outcomeLabel: 'Principle',
        outcome: 'Invoke only what you need. The gates in these skills exist to stop you when it genuinely matters — not to turn every small change into a ceremony.'
      }
    ]
  },

  rules: {
    h2: 'Six rules for combining them',
    intro: 'These are generalised from the gate designs across the skills. Understanding them lets you predict when the agent will stop and ask.',
    items: [
      ['Extract before you implement', '<code>ds-to-storybook</code> explicitly refuses to build a component from an unrecorded Figma node or screenshot; it marks it <code>needs-extraction</code> instead. Skipping extraction only adds a detour.'],
      ['Evidence over intuition', 'The extractor wants an evidence map; visual-parity wants computed styles and token values. When your reason is "it feels off", they go looking for harder evidence or stop and ask.'],
      ['Fix at the most reusable layer', 'token → shared component → variant → composition → page-only style. This order is consistent across governance and visual-parity, and it is why neither will simply paste CSS onto your page.'],
      ['Batch it; do not do it all at once', 'Even if you say "build the whole component library", <code>ds-to-storybook</code> completes only the first batch. That is not laziness — between batches it updates the queue and implementation map so you can interrupt and resume at any point.'],
      ['The three tiers are identical in Figma and in code', 'ref holds raw values only, sys holds cross-component semantics only, and comp is the only layer where component names may appear. <code>figma-m3-variables</code> and <code>design-system-governance</code> share the rule, which is what lets the two sides line up.'],
      ['Docs are the handoff, not a by-product', 'SESSION_STATE, the implementation map, the component queue, the PRD — these exist so the next conversation (possibly another person, possibly another agent) can continue without reading the previous chat.']
    ]
  },

  pitfalls: {
    h2: 'Common misuses',
    intro: 'These situations either get blocked outright or produce something less useful than you expected. Knowing them in advance saves a detour.',
    badLabel: 'Misuse', goodLabel: 'Instead',
    items: [
      ['Running <code>create-design-workspace</code> in the root of an existing app', 'It detects the unrelated code and stops. For existing projects take Journey C, starting from <code>design-system-extractor</code>.'],
      ['Skipping the extractor and calling <code>ds-to-storybook</code> directly', 'Without a design-system package it refuses and sends you back to run or resume the extractor. You need at least token files and component specs.'],
      ['Giving one screenshot but expecting full hover / disabled / responsive behaviour', 'A single static image only supports a first-pass approximation. Provide several images across states and breakpoints, or switch to a Figma source.'],
      ['Using <code>ui-visual-parity</code> to also change copy or data flow', 'It stops and declines. Visual parity stays visual; product behaviour changes belong in a separate request.'],
      ['Promoting prototype CSS straight into production', 'Prototype CSS is deliberately scoped under a feature root class. To productionise, go through extractor → ds-to-storybook.'],
      ['Creating a token like <code>ref/spacing/bottom-bar/padding</code> in Figma’s ref layer', 'A ref-layer name may only express "what value is this", never "where is it used". Anything carrying a component or region name belongs in comp.']
    ]
  },

  install: {
    h2: 'Install and trigger',
    h3a: 'Install to your personal Cursor (available in every project)',
    h3b: 'Install into a project (shared with the team through the repo)',
    after: 'Restart Cursor after copying.',
    h3c: 'How triggering works',
    trigger: 'There are no commands to memorise. A skill is matched by keyword between the description at the top of its <code>SKILL.md</code> and what you write; on a match the agent reads it and follows it automatically. So <strong>describing your situation and the output you want</strong> works better than naming the skill:',
    examples: ['"Pull a design system out of these screenshots for me"', '"This page does not match the design — compare them"', '"Apply the existing Variables to this Figma component"'],
    explicit: 'When you want to be explicit, naming it directly works too: "use design-system-extractor to analyse this folder".',
    h3d: 'Other tools',
    other: '<code>ds-to-storybook</code> ships an installer script that can install itself into Claude Code or Codex. The workspace generated by <code>create-design-workspace</code> keeps entry points for all three tools at once (<code>CLAUDE.md</code>, <code>.cursorrules</code>, <code>AGENTS.md</code>).'
  },

  footer: 'The complete rules for each skill live in its own <code>SKILL.md</code>. This guide only covers how to choose, combine, and sequence them — where the details disagree, <code>SKILL.md</code> wins.'
}

}; /* end I18N */

/* Shell commands are language-independent. */
const CODE_A = 'git clone https://github.com/harrychuang/cursor-skills.git /tmp/cursor-skills-install\ncp -r /tmp/cursor-skills-install/&lt;skill-name&gt; ~/.cursor/skills/';
const CODE_B = 'cp -r /tmp/cursor-skills-install/&lt;skill-name&gt; /your-project/.cursor/skills/';

const SECTION_IDS = ['overview', 'picker', 'skills', 'journeys', 'rules', 'pitfalls', 'install'];

/* ========================================================================= */

const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};

const wrapIn = (parent) => { const w = el('div', 'wrap'); parent.appendChild(w); return w; };
const pad = (i) => String(i + 1).padStart(2, '0');

function render(lang) {
  const t = I18N[lang];
  const app = document.getElementById('app');
  app.textContent = '';

  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle;

  /* --- masthead --- */
  const head = el('header', 'masthead');
  const hw = wrapIn(head);
  hw.append(
    el('p', 'eyebrow', t.eyebrow),
    el('h1', null, t.h1),
    el('p', 'lede', t.lede),
    el('p', 'meta', t.meta)
  );
  app.appendChild(head);

  /* --- toc --- */
  const nav = el('nav', 'toc');
  const nw = wrapIn(nav);
  const ol = el('ol');
  t.toc.forEach((label, i) => {
    const li = el('li');
    li.append(el('span', 'n', pad(i)));
    const a = el('a', null, label);
    a.href = '#' + SECTION_IDS[i];
    li.append(a);
    ol.appendChild(li);
  });
  nw.appendChild(ol);
  app.appendChild(nav);

  const section = (id, i, h2, introHtml) => {
    const s = el('section');
    s.id = id;
    const w = wrapIn(s);
    w.append(el('p', 'sec-num', pad(i)), el('h2', null, h2));
    if (introHtml) w.append(el('div', 'intro col', introHtml));
    app.appendChild(s);
    return w;
  };

  /* --- 01 overview --- */
  {
    const w = section('overview', 0, t.overview.h2, t.overview.intro.map(p => '<p>' + p + '</p>').join(''));
    const pipe = el('div', 'pipeline');
    t.overview.stages.forEach((st, i) => {
      const d = el('div', 'stage');
      d.append(el('span', 'k', 'STAGE ' + (i + 1)), el('div', 't', st.t), el('div', 's', st.s));
      pipe.appendChild(d);
    });
    w.append(pipe, el('p', 'caption', t.overview.caption));
  }

  /* --- 02 picker --- */
  {
    const w = section('picker', 1, t.picker.h2, '<p>' + t.picker.intro + '</p>');
    const tw = el('div', 'tablewrap');
    const table = el('table');
    table.innerHTML =
      '<thead><tr><th style="width:44%">' + t.picker.th[0] + '</th><th>' + t.picker.th[1] + '</th></tr></thead>' +
      '<tbody>' + t.picker.rows.map(r =>
        '<tr><td>' + r[0] + '</td><td class="skill"><code>' + r[1] + '</code></td></tr>').join('') + '</tbody>';
    tw.appendChild(table);
    w.appendChild(tw);
  }

  /* --- 03 skills --- */
  {
    const w = section('skills', 2, t.skills.h2, '<p>' + t.skills.intro + '</p>');
    let shownGroup = -1;
    SKILL_ORDER.forEach(key => {
      const e = t.skills.entries[key];
      if (e.group !== shownGroup) {
        shownGroup = e.group;
        const gl = el('p', 'group-label' + (w.querySelector('.group-label') ? '' : ' first'), t.skills.groups[e.group]);
        w.appendChild(gl);
      }
      const row = el('div', 'skill-entry');
      const name = el('div', 'skill-name', key === 'workspace' ? 'create-design-workspace'
        : key === 'extractor' ? 'design-system-extractor'
        : key === 'storybook' ? 'ds-to-storybook'
        : key === 'governance' ? 'design-system-governance'
        : key === 'parity' ? 'ui-visual-parity'
        : key === 'figma' ? 'figma-m3-variables'
        : key === 'proto' ? 'storybook-product-prototype'
        : 'prototype-storybook-flow');
      name.appendChild(el('span', 'skill-tag', e.tag));
      const body = el('div', 'skill-body', e.body.map(p => '<p>' + p + '</p>').join(''));
      const dl = el('dl', 'facts');
      e.facts.forEach(([k, v]) => { dl.append(el('dt', null, k), el('dd', null, v)); });
      body.appendChild(dl);
      row.append(name, body);
      w.appendChild(row);
    });
  }

  /* --- 04 journeys --- */
  {
    const w = section('journeys', 3, t.journeys.h2, '<p>' + t.journeys.intro + '</p>');
    t.journeys.items.forEach(j => {
      const box = el('div', 'journey');
      const head = el('div', 'journey-head');
      head.append(el('span', 'journey-num', j.n));
      const hb = el('div');
      hb.appendChild(el('h3', null, j.h3));
      head.appendChild(hb);
      box.append(head, el('p', 'situation', j.situation));
      const steps = el('ol', 'steps');
      j.steps.forEach(s => {
        const li = el('li');
        li.appendChild(el('span', 'step-title', s.t));
        s.p.forEach(p => li.appendChild(el('p', null, p)));
        steps.appendChild(li);
      });
      box.appendChild(steps);
      const out = el('div', 'outcome');
      out.append(el('b', null, j.outcomeLabel || t.journeys.outcomeLabel));
      out.append(el('span', null, j.outcome));
      box.appendChild(out);
      w.appendChild(box);
    });
  }

  /* --- 05 rules --- */
  {
    const w = section('rules', 4, t.rules.h2, '<p>' + t.rules.intro + '</p>');
    const list = el('ol', 'rules');
    t.rules.items.forEach(([b, s]) => {
      const li = el('li');
      li.appendChild(el('div', null, '<b>' + b + '</b><span>' + s + '</span>'));
      list.appendChild(li);
    });
    w.appendChild(list);
  }

  /* --- 06 pitfalls --- */
  {
    const w = section('pitfalls', 5, t.pitfalls.h2, '<p>' + t.pitfalls.intro + '</p>');
    t.pitfalls.items.forEach(([bad, good]) => {
      const d = el('div', 'pitfall');
      d.innerHTML =
        '<div class="bad"><div class="lbl">' + t.pitfalls.badLabel + '</div><div>' + bad + '</div></div>' +
        '<div class="good"><div class="lbl">' + t.pitfalls.goodLabel + '</div><div>' + good + '</div></div>';
      w.appendChild(d);
    });
  }

  /* --- 07 install --- */
  {
    const w = section('install', 6, t.install.h2, null);
    w.appendChild(el('div', 'col', '<h3>' + t.install.h3a + '</h3>'));
    w.appendChild(el('pre', null, '<code>' + CODE_A + '</code>'));
    w.appendChild(el('div', 'col', '<h3>' + t.install.h3b + '</h3>'));
    w.appendChild(el('pre', null, '<code>' + CODE_B + '</code>'));
    w.appendChild(el('div', 'col',
      '<p>' + t.install.after + '</p>' +
      '<h3>' + t.install.h3c + '</h3>' +
      '<p>' + t.install.trigger + '</p>' +
      '<p class="examples">' + t.install.examples.join('<br>') + '</p>' +
      '<p>' + t.install.explicit + '</p>' +
      '<h3>' + t.install.h3d + '</h3>' +
      '<p>' + t.install.other + '</p>'
    ));
  }

  /* --- footer --- */
  const f = el('footer');
  wrapIn(f).appendChild(el('p', null, t.footer));
  app.appendChild(f);
}

/* ------------------------------- controls ------------------------------- */

const LANGS = ['zh', 'ja', 'en'];
const THEMES = ['auto', 'light', 'dark'];

let currentLang = localStorage.getItem('guide-lang');
if (!LANGS.includes(currentLang)) {
  const nav = (navigator.language || 'en').toLowerCase();
  currentLang = nav.startsWith('ja') ? 'ja' : nav.startsWith('zh') ? 'zh' : 'en';
}

let currentTheme = localStorage.getItem('guide-theme');
if (!THEMES.includes(currentTheme)) currentTheme = 'auto';

function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  [...document.querySelectorAll('#themeSeg button')].forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.theme === currentTheme)));
}

function buildControls() {
  const ls = document.getElementById('langSeg');
  ls.textContent = '';
  LANGS.forEach(code => {
    const b = el('button', null, I18N[code].ui.langLabel);
    b.dataset.lang = code;
    b.type = 'button';
    b.setAttribute('aria-pressed', String(code === currentLang));
    b.addEventListener('click', () => {
      if (code === currentLang) return;
      currentLang = code;
      localStorage.setItem('guide-lang', code);
      const hash = location.hash;
      render(currentLang);
      buildControls();
      applyTheme();
      if (hash) { const target = document.querySelector(hash); if (target) target.scrollIntoView(); }
    });
    ls.appendChild(b);
  });

  const ts = document.getElementById('themeSeg');
  ts.textContent = '';
  const labels = I18N[currentLang].ui.themes;
  THEMES.forEach(code => {
    const b = el('button', null, labels[code]);
    b.dataset.theme = code;
    b.type = 'button';
    b.addEventListener('click', () => {
      currentTheme = code;
      localStorage.setItem('guide-theme', code);
      applyTheme();
    });
    ts.appendChild(b);
  });
}

render(currentLang);
buildControls();
applyTheme();

if (location.hash) {
  const target = document.querySelector(location.hash);
  if (target) requestAnimationFrame(() => target.scrollIntoView());
}
</script>
