<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        /* Ref: project-aligned concrete values for the standalone plugin. */
        --cm-ref-review-color-scheme: dark;
        --cm-ref-review-color-canvas: #151515;
        --cm-ref-review-color-surface: #252525;
        --cm-ref-review-color-surface-raised: #2a2a2a;
        --cm-ref-review-color-surface-hover: #333333;
        --cm-ref-review-color-outline: #3d3d3d;
        --cm-ref-review-color-outline-strong: #515151;
        --cm-ref-review-color-text: #ffffff;
        --cm-ref-review-color-text-secondary: #c0c0c0;
        --cm-ref-review-color-text-muted: #909090;
        --cm-ref-review-color-primary: #ff7800;
        --cm-ref-review-color-primary-pressed: #cc6102;
        --cm-ref-review-color-on-primary: #ffffff;
        --cm-ref-review-color-primary-wash: rgba(255, 120, 0, 0.12);
        --cm-ref-review-color-primary-outline: rgba(255, 120, 0, 0.5);
        --cm-ref-review-color-danger: #ff4f4f;
        --cm-ref-review-color-danger-wash: rgba(255, 79, 79, 0.1);
        --cm-ref-review-color-disabled: #515151;
        --cm-ref-review-color-on-disabled: #909090;
        --cm-ref-review-color-transparent: transparent;
        --cm-ref-review-font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --cm-ref-review-font-size-caption: 11px;
        --cm-ref-review-font-size-label: 12px;
        --cm-ref-review-font-size-body: 13px;
        --cm-ref-review-font-size-title: 16px;
        --cm-ref-review-font-size-heading: 18px;
        --cm-ref-review-line-height-caption: 16px;
        --cm-ref-review-line-height-label: 18px;
        --cm-ref-review-line-height-body: 20px;
        --cm-ref-review-line-height-title: 24px;
        --cm-ref-review-font-weight-regular: 400;
        --cm-ref-review-font-weight-medium: 500;
        --cm-ref-review-font-weight-semibold: 600;
        --cm-ref-review-space-none: 0;
        --cm-ref-review-space-2: 2px;
        --cm-ref-review-space-4: 4px;
        --cm-ref-review-space-6: 6px;
        --cm-ref-review-space-8: 8px;
        --cm-ref-review-space-10: 10px;
        --cm-ref-review-space-12: 12px;
        --cm-ref-review-space-16: 16px;
        --cm-ref-review-space-20: 20px;
        --cm-ref-review-space-24: 24px;
        --cm-ref-review-size-control: 36px;
        --cm-ref-review-size-icon: 18px;
        --cm-ref-review-border-width: 1px;
        --cm-ref-review-focus-width: 2px;
        --cm-ref-review-focus-offset: 2px;
        --cm-ref-review-radius-control: 8px;
        --cm-ref-review-radius-card: 12px;
        --cm-ref-review-radius-pill: 999px;
        --cm-ref-review-opacity-disabled: 0.56;
        --cm-ref-review-motion-fast: 120ms;

        /* Sys: semantic aliases reference Ref only. */
        --cm-sys-review-color-background: var(--cm-ref-review-color-canvas);
        --cm-sys-review-color-scheme: var(--cm-ref-review-color-scheme);
        --cm-sys-review-color-surface: var(--cm-ref-review-color-surface);
        --cm-sys-review-color-surface-raised: var(--cm-ref-review-color-surface-raised);
        --cm-sys-review-color-surface-hover: var(--cm-ref-review-color-surface-hover);
        --cm-sys-review-color-outline: var(--cm-ref-review-color-outline);
        --cm-sys-review-color-outline-strong: var(--cm-ref-review-color-outline-strong);
        --cm-sys-review-color-on-surface: var(--cm-ref-review-color-text);
        --cm-sys-review-color-on-surface-secondary: var(--cm-ref-review-color-text-secondary);
        --cm-sys-review-color-on-surface-muted: var(--cm-ref-review-color-text-muted);
        --cm-sys-review-color-action: var(--cm-ref-review-color-primary);
        --cm-sys-review-color-action-pressed: var(--cm-ref-review-color-primary-pressed);
        --cm-sys-review-color-on-action: var(--cm-ref-review-color-on-primary);
        --cm-sys-review-color-action-wash: var(--cm-ref-review-color-primary-wash);
        --cm-sys-review-color-action-outline: var(--cm-ref-review-color-primary-outline);
        --cm-sys-review-color-error: var(--cm-ref-review-color-danger);
        --cm-sys-review-color-error-wash: var(--cm-ref-review-color-danger-wash);
        --cm-sys-review-color-disabled: var(--cm-ref-review-color-disabled);
        --cm-sys-review-color-on-disabled: var(--cm-ref-review-color-on-disabled);
        --cm-sys-review-color-transparent: var(--cm-ref-review-color-transparent);
        --cm-sys-review-font-family: var(--cm-ref-review-font-family);
        --cm-sys-review-text-caption-size: var(--cm-ref-review-font-size-caption);
        --cm-sys-review-text-label-size: var(--cm-ref-review-font-size-label);
        --cm-sys-review-text-body-size: var(--cm-ref-review-font-size-body);
        --cm-sys-review-text-title-size: var(--cm-ref-review-font-size-title);
        --cm-sys-review-text-heading-size: var(--cm-ref-review-font-size-heading);
        --cm-sys-review-text-caption-line: var(--cm-ref-review-line-height-caption);
        --cm-sys-review-text-label-line: var(--cm-ref-review-line-height-label);
        --cm-sys-review-text-body-line: var(--cm-ref-review-line-height-body);
        --cm-sys-review-text-title-line: var(--cm-ref-review-line-height-title);
        --cm-sys-review-weight-regular: var(--cm-ref-review-font-weight-regular);
        --cm-sys-review-weight-medium: var(--cm-ref-review-font-weight-medium);
        --cm-sys-review-weight-semibold: var(--cm-ref-review-font-weight-semibold);
        --cm-sys-review-space-none: var(--cm-ref-review-space-none);
        --cm-sys-review-space-xs: var(--cm-ref-review-space-4);
        --cm-sys-review-space-sm: var(--cm-ref-review-space-8);
        --cm-sys-review-space-md: var(--cm-ref-review-space-12);
        --cm-sys-review-space-lg: var(--cm-ref-review-space-16);
        --cm-sys-review-space-xl: var(--cm-ref-review-space-20);
        --cm-sys-review-space-xxl: var(--cm-ref-review-space-24);
        --cm-sys-review-control-height: var(--cm-ref-review-size-control);
        --cm-sys-review-icon-size: var(--cm-ref-review-size-icon);
        --cm-sys-review-border-width: var(--cm-ref-review-border-width);
        --cm-sys-review-focus-width: var(--cm-ref-review-focus-width);
        --cm-sys-review-focus-offset: var(--cm-ref-review-focus-offset);
        --cm-sys-review-radius-control: var(--cm-ref-review-radius-control);
        --cm-sys-review-radius-card: var(--cm-ref-review-radius-card);
        --cm-sys-review-radius-pill: var(--cm-ref-review-radius-pill);
        --cm-sys-review-opacity-disabled: var(--cm-ref-review-opacity-disabled);
        --cm-sys-review-motion-fast: var(--cm-ref-review-motion-fast);

        /* Comp: component slots reference Sys only. */
        --cm-comp-review-app-container-color: var(--cm-sys-review-color-background);
        --cm-comp-review-app-color-scheme: var(--cm-sys-review-color-scheme);
        --cm-comp-review-app-label-color: var(--cm-sys-review-color-on-surface);
        --cm-comp-review-app-muted-color: var(--cm-sys-review-color-on-surface-muted);
        --cm-comp-review-card-container-color: var(--cm-sys-review-color-surface);
        --cm-comp-review-card-raised-color: var(--cm-sys-review-color-surface-raised);
        --cm-comp-review-card-border-color: var(--cm-sys-review-color-outline);
        --cm-comp-review-card-radius: var(--cm-sys-review-radius-card);
        --cm-comp-review-card-padding: var(--cm-sys-review-space-lg);
        --cm-comp-review-card-gap: var(--cm-sys-review-space-md);
        --cm-comp-review-button-height: var(--cm-sys-review-control-height);
        --cm-comp-review-button-radius: var(--cm-sys-review-radius-control);
        --cm-comp-review-button-padding-x: var(--cm-sys-review-space-md);
        --cm-comp-review-button-primary-color: var(--cm-sys-review-color-action);
        --cm-comp-review-button-primary-pressed-color: var(--cm-sys-review-color-action-pressed);
        --cm-comp-review-button-primary-label-color: var(--cm-sys-review-color-on-action);
        --cm-comp-review-button-secondary-color: var(--cm-sys-review-color-surface-raised);
        --cm-comp-review-button-secondary-hover-color: var(--cm-sys-review-color-surface-hover);
        --cm-comp-review-button-secondary-label-color: var(--cm-sys-review-color-on-surface);
        --cm-comp-review-button-border-color: var(--cm-sys-review-color-outline-strong);
        --cm-comp-review-button-disabled-color: var(--cm-sys-review-color-disabled);
        --cm-comp-review-button-disabled-label-color: var(--cm-sys-review-color-on-disabled);
        --cm-comp-review-button-transparent-color: var(--cm-sys-review-color-transparent);
        --cm-comp-review-focus-color: var(--cm-sys-review-color-action);
        --cm-comp-review-focus-width: var(--cm-sys-review-focus-width);
        --cm-comp-review-focus-offset: var(--cm-sys-review-focus-offset);
        --cm-comp-review-recommendation-container-color: var(--cm-sys-review-color-action-wash);
        --cm-comp-review-recommendation-border-color: var(--cm-sys-review-color-action-outline);
        --cm-comp-review-error-label-color: var(--cm-sys-review-color-error);
        --cm-comp-review-error-container-color: var(--cm-sys-review-color-error-wash);
        --cm-comp-review-divider-color: var(--cm-sys-review-color-outline);
        --cm-comp-review-progress-container-color: var(--cm-sys-review-color-surface-raised);
        --cm-comp-review-progress-label-color: var(--cm-sys-review-color-on-surface-secondary);
        --cm-comp-review-font-family: var(--cm-sys-review-font-family);
        --cm-comp-review-title-size: var(--cm-sys-review-text-title-size);
        --cm-comp-review-heading-size: var(--cm-sys-review-text-heading-size);
        --cm-comp-review-body-size: var(--cm-sys-review-text-body-size);
        --cm-comp-review-label-size: var(--cm-sys-review-text-label-size);
        --cm-comp-review-caption-size: var(--cm-sys-review-text-caption-size);
        --cm-comp-review-title-line: var(--cm-sys-review-text-title-line);
        --cm-comp-review-body-line: var(--cm-sys-review-text-body-line);
        --cm-comp-review-label-line: var(--cm-sys-review-text-label-line);
        --cm-comp-review-caption-line: var(--cm-sys-review-text-caption-line);
        --cm-comp-review-regular-weight: var(--cm-sys-review-weight-regular);
        --cm-comp-review-medium-weight: var(--cm-sys-review-weight-medium);
        --cm-comp-review-semibold-weight: var(--cm-sys-review-weight-semibold);
        --cm-comp-review-space-none: var(--cm-sys-review-space-none);
        --cm-comp-review-space-xs: var(--cm-sys-review-space-xs);
        --cm-comp-review-space-sm: var(--cm-sys-review-space-sm);
        --cm-comp-review-space-md: var(--cm-sys-review-space-md);
        --cm-comp-review-space-lg: var(--cm-sys-review-space-lg);
        --cm-comp-review-space-xl: var(--cm-sys-review-space-xl);
        --cm-comp-review-space-xxl: var(--cm-sys-review-space-xxl);
        --cm-comp-review-border-width: var(--cm-sys-review-border-width);
        --cm-comp-review-radius-control: var(--cm-sys-review-radius-control);
        --cm-comp-review-radius-pill: var(--cm-sys-review-radius-pill);
        --cm-comp-review-disabled-opacity: var(--cm-sys-review-opacity-disabled);
        --cm-comp-review-motion-fast: var(--cm-sys-review-motion-fast);
        --cm-comp-review-size-icon: var(--cm-sys-review-icon-size);
        color-scheme: var(--cm-comp-review-app-color-scheme);
      }

      * { box-sizing: border-box; }
      body {
        min-block-size: 100vh;
        margin: var(--cm-comp-review-space-none);
        padding: var(--cm-comp-review-space-lg);
        color: var(--cm-comp-review-app-label-color);
        background: var(--cm-comp-review-app-container-color);
        font-family: var(--cm-comp-review-font-family);
      }
      main { display: grid; gap: var(--cm-comp-review-space-lg); }
      h1, h2, h3, p { margin: var(--cm-comp-review-space-none); }
      h1 { font-size: var(--cm-comp-review-title-size); line-height: var(--cm-comp-review-title-line); }
      h2 { font-size: var(--cm-comp-review-heading-size); line-height: var(--cm-comp-review-title-line); }
      h3 { font-size: var(--cm-comp-review-label-size); line-height: var(--cm-comp-review-label-line); }
      p { color: var(--cm-comp-review-progress-label-color); font-size: var(--cm-comp-review-body-size); line-height: var(--cm-comp-review-body-line); }
      header { display: grid; gap: var(--cm-comp-review-space-xs); }
      .app-subtitle { color: var(--cm-comp-review-progress-label-color); }
      .reviewer-context { color: var(--cm-comp-review-app-muted-color); font-size: var(--cm-comp-review-caption-size); line-height: var(--cm-comp-review-caption-line); }
      label { display: grid; gap: var(--cm-comp-review-space-sm); color: var(--cm-comp-review-progress-label-color); font-size: var(--cm-comp-review-label-size); line-height: var(--cm-comp-review-label-line); }
      input {
        inline-size: 100%;
        min-block-size: var(--cm-comp-review-button-height);
        padding: var(--cm-comp-review-space-sm) var(--cm-comp-review-space-md);
        color: var(--cm-comp-review-app-label-color);
        background: var(--cm-comp-review-card-raised-color);
        border: var(--cm-comp-review-border-width) solid var(--cm-comp-review-button-border-color);
        border-radius: var(--cm-comp-review-radius-control);
        font: inherit;
      }
      button {
        min-block-size: var(--cm-comp-review-button-height);
        padding: var(--cm-comp-review-space-sm) var(--cm-comp-review-button-padding-x);
        color: var(--cm-comp-review-button-primary-label-color);
        background: var(--cm-comp-review-button-primary-color);
        border: var(--cm-comp-review-border-width) solid var(--cm-comp-review-button-transparent-color);
        border-radius: var(--cm-comp-review-button-radius);
        font: inherit;
        font-size: var(--cm-comp-review-label-size);
        font-weight: var(--cm-comp-review-semibold-weight);
        cursor: pointer;
        transition: background var(--cm-comp-review-motion-fast);
      }
      button:not(:disabled):hover { background: var(--cm-comp-review-button-primary-pressed-color); }
      button:disabled {
        color: var(--cm-comp-review-button-disabled-label-color);
        background: var(--cm-comp-review-button-disabled-color);
        opacity: var(--cm-comp-review-disabled-opacity);
        cursor: default;
      }
      :focus-visible {
        outline: var(--cm-comp-review-focus-width) solid var(--cm-comp-review-focus-color);
        outline-offset: var(--cm-comp-review-focus-offset);
      }
      .state {
        display: grid;
        gap: var(--cm-comp-review-card-gap);
        padding: var(--cm-comp-review-card-padding);
        background: var(--cm-comp-review-card-container-color);
        border: var(--cm-comp-review-border-width) solid var(--cm-comp-review-card-border-color);
        border-radius: var(--cm-comp-review-card-radius);
      }
      .login-form, .review-card, .decision-actions, .details, .confirmation, .failure, .empty-state, .workflow-overview, .attention-list, .attention-item {
        display: grid;
        gap: var(--cm-comp-review-space-md);
      }
      .login-heading { display: grid; gap: var(--cm-comp-review-space-xs); }
      .field-helper, .breadcrumb, .missing-target, .technical-details { color: var(--cm-comp-review-app-muted-color); font-size: var(--cm-comp-review-caption-size); line-height: var(--cm-comp-review-caption-line); }
      .progress-row { display: flex; align-items: center; justify-content: space-between; gap: var(--cm-comp-review-space-sm); }
      .progress {
        padding: var(--cm-comp-review-space-xs) var(--cm-comp-review-space-sm);
        color: var(--cm-comp-review-progress-label-color);
        background: var(--cm-comp-review-progress-container-color);
        border-radius: var(--cm-comp-review-radius-pill);
        font-size: var(--cm-comp-review-caption-size);
        line-height: var(--cm-comp-review-caption-line);
        font-weight: var(--cm-comp-review-semibold-weight);
      }
      .workflow-overview {
        padding-block-end: var(--cm-comp-review-space-md);
        border-block-end: var(--cm-comp-review-border-width) solid var(--cm-comp-review-divider-color);
      }
      .workflow-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--cm-comp-review-space-sm); }
      .workflow-heading p { color: var(--cm-comp-review-app-muted-color); font-size: var(--cm-comp-review-caption-size); line-height: var(--cm-comp-review-caption-line); }
      .workflow-counts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--cm-comp-review-space-xs); }
      .workflow-count {
        display: grid;
        gap: var(--cm-comp-review-space-xs);
        padding: var(--cm-comp-review-space-sm) var(--cm-comp-review-space-xs);
        text-align: center;
        background: var(--cm-comp-review-progress-container-color);
        border-radius: var(--cm-comp-review-radius-control);
      }
      .workflow-count strong { color: var(--cm-comp-review-app-label-color); font-size: var(--cm-comp-review-body-size); line-height: var(--cm-comp-review-body-line); }
      .workflow-count span { color: var(--cm-comp-review-app-muted-color); font-size: var(--cm-comp-review-caption-size); line-height: var(--cm-comp-review-caption-line); }
      .attention-list { gap: var(--cm-comp-review-space-sm); }
      .attention-item { gap: var(--cm-comp-review-space-xs); padding: var(--cm-comp-review-space-sm); background: var(--cm-comp-review-card-raised-color); border-radius: var(--cm-comp-review-radius-control); }
      .attention-item strong { font-size: var(--cm-comp-review-label-size); line-height: var(--cm-comp-review-label-line); }
      .attention-item p { font-size: var(--cm-comp-review-caption-size); line-height: var(--cm-comp-review-caption-line); }
      .component-heading { display: grid; gap: var(--cm-comp-review-space-xs); }
      .similar-hint { color: var(--cm-comp-review-progress-label-color); font-size: var(--cm-comp-review-caption-size); line-height: var(--cm-comp-review-caption-line); }
      .recommendation {
        display: grid;
        gap: var(--cm-comp-review-space-md);
        padding: var(--cm-comp-review-space-md);
        background: var(--cm-comp-review-recommendation-container-color);
        border: var(--cm-comp-review-border-width) solid var(--cm-comp-review-recommendation-border-color);
        border-radius: var(--cm-comp-review-radius-control);
      }
      .recommendation-heading { display: flex; align-items: center; gap: var(--cm-comp-review-space-sm); }
      .recommendation-chip {
        padding: var(--cm-comp-review-space-xs) var(--cm-comp-review-space-sm);
        color: var(--cm-comp-review-button-primary-label-color);
        background: var(--cm-comp-review-button-primary-color);
        border-radius: var(--cm-comp-review-radius-pill);
        font-size: var(--cm-comp-review-caption-size);
        line-height: var(--cm-comp-review-caption-line);
        font-weight: var(--cm-comp-review-semibold-weight);
      }
      .recommendation-label { color: var(--cm-comp-review-app-label-color); font-size: var(--cm-comp-review-body-size); line-height: var(--cm-comp-review-body-line); font-weight: var(--cm-comp-review-semibold-weight); }
      .recommendation-reason { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 1; }
      .secondary, .quiet-button, .disclosure-button, .refresh-button, .navigation button, .cancel-button {
        color: var(--cm-comp-review-button-secondary-label-color);
        background: var(--cm-comp-review-button-secondary-color);
        border-color: var(--cm-comp-review-button-border-color);
      }
      .secondary:not(:disabled):hover, .quiet-button:not(:disabled):hover, .disclosure-button:not(:disabled):hover, .refresh-button:not(:disabled):hover, .navigation button:not(:disabled):hover, .cancel-button:not(:disabled):hover { background: var(--cm-comp-review-button-secondary-hover-color); }
      .quiet-button, .disclosure-button { min-block-size: auto; padding: var(--cm-comp-review-space-xs) var(--cm-comp-review-space-sm); justify-self: start; }
      .details { padding-block-start: var(--cm-comp-review-space-xs); }
      .details section { display: grid; gap: var(--cm-comp-review-space-xs); }
      .details ul { margin: var(--cm-comp-review-space-none); padding-inline-start: var(--cm-comp-review-space-xl); color: var(--cm-comp-review-progress-label-color); font-size: var(--cm-comp-review-label-size); line-height: var(--cm-comp-review-label-line); }
      .alternative-section { display: grid; gap: var(--cm-comp-review-space-sm); }
      .missing-target { color: var(--cm-comp-review-error-label-color); }
      .confirmation {
        padding: var(--cm-comp-review-space-md);
        background: var(--cm-comp-review-card-raised-color);
        border: var(--cm-comp-review-border-width) solid var(--cm-comp-review-recommendation-border-color);
        border-radius: var(--cm-comp-review-radius-control);
      }
      .confirmation-copy { display: grid; gap: var(--cm-comp-review-space-xs); }
      .confirmation-actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--cm-comp-review-space-sm); }
      .navigation { display: grid; grid-template-columns: 1fr 1fr; gap: var(--cm-comp-review-space-sm); padding-block-start: var(--cm-comp-review-space-xs); border-block-start: var(--cm-comp-review-border-width) solid var(--cm-comp-review-divider-color); }
      .footer-actions { display: flex; justify-content: flex-end; }
      .failure {
        padding: var(--cm-comp-review-space-md);
        color: var(--cm-comp-review-error-label-color);
        background: var(--cm-comp-review-error-container-color);
        border: var(--cm-comp-review-border-width) solid var(--cm-comp-review-error-label-color);
        border-radius: var(--cm-comp-review-radius-control);
        font-size: var(--cm-comp-review-label-size);
        line-height: var(--cm-comp-review-label-line);
      }
      .failure:empty { display: none; }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

          && project.id.trim()
          && typeof project.displayName === "string"
          && project.displayName.trim()

      function renderFeatureHeader(title, body) {
        return [
          '<div class="view-navigation"><button class="back-home-button" id="backHomeButton" type="button">' + escapeHtml(COPY.returnHome) + '</button></div>',
          '<div class="view-heading"><h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(body || "") + '</p></div>',
        ].join("");
      }

      function bindBackHome() {
        var button = document.getElementById("backHomeButton");
        if (!button) return;
        if (activeView === "cleanup" && cleanupSession.applyInFlight) button.disabled = true;
        button.addEventListener("click", function () {
          if (!cleanupSession.applyInFlight) renderHome();
        });
      }

      function renderHome() {
        if (!projectContext) return;
        activeView = "home";
        var cards = [];
        if (featureEnabled("cleanup")) cards.push({ view: "cleanup", title: COPY.cleanupTitle, helper: COPY.cleanupHelper, action: COPY.cleanupAction });
        if (featureEnabled("review")) cards.push({ view: "review", title: COPY.reviewTitle, helper: COPY.reviewHelper, action: COPY.reviewAction });
        if (featureEnabled("workflow")) cards.push({ view: "workflow", title: COPY.workflowFeatureTitle, helper: COPY.workflowHelper, action: COPY.workflowAction });
        appState.innerHTML = [
          '<section class="home-view"><div class="home-intro"><h2>' + escapeHtml(COPY.homeTitle) + '</h2><p>' + escapeHtml(COPY.homeBody) + '</p></div>',
          '<div class="feature-grid">',
          cards.slice(0, 3).map(function (card) {
            return '<article class="feature-card" data-feature="' + card.view + '"><h3>' + escapeHtml(card.title) + '</h3><p>'
              + escapeHtml(card.helper) + '</p><button id="open-' + card.view + '-view" type="button" data-open-view="' + card.view + '">' + escapeHtml(card.action) + '</button></article>';
          }).join(""),
          '</div></section>',
        ].join("");
        cards.slice(0, 3).forEach(function (card) {
          var button = document.getElementById("open-" + card.view + "-view");
          if (button) button.addEventListener("click", function () { openFeature(card.view); });
        });
      }

      function cleanupStatusLabel(status) {
        var labels = {
          queued: COPY.taskStatusQueued,
          analyzing: COPY.taskStatusAnalyzing,
          "plan-ready": COPY.taskStatusPlanReady,
          applying: COPY.taskStatusApplying,
          completed: COPY.taskStatusCompleted,
          blocked: COPY.taskStatusBlocked,
          stale: COPY.taskStatusStale,
        };
        return labels[status] || COPY.taskStatusBlocked;
      }

      function cleanupStatusMessage(status) {
        var messages = {
          queued: COPY.cleanupQueued,
          analyzing: COPY.cleanupAnalyzing,
          "plan-ready": COPY.cleanupPlanReady,
          applying: COPY.cleanupApplying,
          completed: COPY.cleanupCompleted,
          blocked: COPY.cleanupBlocked,
          stale: COPY.cleanupStale,
        };
        return messages[status] || COPY.cleanupBlocked;
      }

      function dispatchMessage(dispatch) {
        if (!dispatch.approved) return COPY.dispatchAwaitingApproval;
        if (dispatch.boardColumn === "RUNNING") return COPY.dispatchRunning;
        if (dispatch.boardColumn === "NEEDS_ATTENTION") return COPY.dispatchNeedsAttention;
        if (dispatch.boardColumn === "DONE") return COPY.dispatchClosed;
        return dispatch.stalled ? COPY.dispatchStalled : COPY.dispatchWaitingClaim;
      }

      /** 派工任務的看板狀態行；未派工的任務回空字串（standalone 畫面完全不變）。 */
      function renderDispatchStatus(task) {
        if (!task || !task.dispatch || !task.dispatch.cardId) return "";
        return '<p class="task-meta">' + escapeHtml(dispatchMessage(task.dispatch)) + '</p>'
          + '<p class="task-meta">' + escapeHtml(copy("dispatchCardRef", { cardId: task.dispatch.cardId })) + '</p>';
      }

      function cleanupSelectionError(errorCode) {
        if (errorCode === "cleanup-scope-required") return COPY.cleanupScopeRequired;
        if (errorCode === "overlapping-cleanup-scope") return COPY.cleanupScopeOverlapping;
        if (errorCode === "cleanup-batch-too-large") return copy("cleanupBatchTooLarge", { max: CLEANUP_BATCH_MAX });
        if (errorCode === "unsupported-cleanup-scope") return COPY.cleanupScopeUnsupported;
        if (errorCode === "cleanup-scope-too-large") return COPY.cleanupScopeTooLarge;
        return COPY.cleanupScopeInvalid;
      }

      function cleanupTaskOperations() {
        return cleanupSession.task && cleanupSession.task.plan && Array.isArray(cleanupSession.task.plan.operations)
          ? cleanupSession.task.plan.operations
          : [];
      }

      function cleanupOperationCounts(operations) {
        var counts = { rename: 0, reorder: 0, move: 0 };
        operations.forEach(function (operation) {
          if (operation.type === "rename-node") counts.rename += 1;
          else if (operation.type === "reorder-node") counts.reorder += 1;
          else if (operation.type === "move-node") counts.move += 1;
        });
        return counts;
      }

      function initializeCleanupPlanSelection() {
        var task = cleanupSession.task;
        var operations = cleanupTaskOperations();
        if (!task || operations.length === 0 || cleanupSession.selectionRevision === task.revision) return;
        cleanupSession.selectedOperationIds = operations.map(function (operation) { return operation.operationId; });
        cleanupSession.selectionRevision = task.revision;
        cleanupSession.detailsExpanded = false;
        cleanupSession.confirmationOpen = false;
      }

      function cleanupOperationTitle(operation) {
        if (operation.type === "rename-node") {
          return copy("cleanupOperationRename", { before: operation.beforeName, after: operation.afterName });
        }
        if (operation.type === "reorder-node") return COPY.cleanupOperationReorder;
        return COPY.cleanupOperationMove;
      }

      function renderCleanupOperations(operations) {
        if (!cleanupSession.detailsExpanded) return "";
        return '<div class="operation-list" id="cleanupOperationList" role="group" aria-label="' + escapeHtml(COPY.cleanupShowDetails) + '">'
          + operations.map(function (operation, index) {
            var selected = cleanupSession.selectedOperationIds.indexOf(operation.operationId) !== -1;
            return '<label class="operation-item" for="cleanupOperation' + index + '">'
              + '<input id="cleanupOperation' + index + '" type="checkbox"' + (selected ? ' checked' : '')
              + (cleanupSession.applyInFlight ? ' disabled' : '') + ' />'
              + '<span class="operation-copy"><strong>' + escapeHtml(cleanupOperationTitle(operation)) + '</strong><span>'
              + escapeHtml(operation.reason || "") + '</span></span></label>';
          }).join("") + '</div>';
      }

      function renderCleanupPlan() {
        var operations = cleanupTaskOperations();
        initializeCleanupPlanSelection();
        var counts = cleanupOperationCounts(operations);
        var selectedCount = cleanupSession.selectedOperationIds.length;
        var confirmation = cleanupSession.confirmationOpen
          ? '<section class="confirmation" id="cleanupConfirmationDialog" role="dialog" aria-labelledby="cleanupConfirmationHeading" tabindex="-1">'
            + '<div class="confirmation-copy"><h3 id="cleanupConfirmationHeading">' + escapeHtml(COPY.cleanupConfirmationTitle) + '</h3>'
            + '<p>' + escapeHtml(copy("cleanupConfirmationScope", { name: cleanupSession.task.scopeName })) + '</p>'
            + '<p>' + escapeHtml(copy("cleanupConfirmationCount", { count: selectedCount })) + '</p>'
            + '<p>' + escapeHtml(COPY.cleanupConfirmationRisk) + '</p></div>'
            + '<div class="confirmation-actions"><button class="cancel-button" id="cancelCleanupApplyButton" type="button"'
            + (cleanupSession.applyInFlight ? ' disabled' : '') + '>' + escapeHtml(COPY.returnEdit)
            + '</button><button id="confirmCleanupApplyButton" type="button" data-primary-action="true"'
            + (cleanupSession.applyInFlight ? ' disabled' : '') + '>'
            + escapeHtml(COPY.cleanupConfirmApply) + '</button></div></section>'
          : '';
        return '<section class="cleanup-plan"><div><h3>' + escapeHtml(COPY.cleanupPlanReady) + '</h3><p>'
          + escapeHtml(COPY.cleanupPlanSummary) + '</p></div><div class="cleanup-counts">'
          + '<div class="cleanup-count"><strong>' + counts.rename + '</strong><span>' + escapeHtml(COPY.cleanupRenameCount) + '</span></div>'
          + '<div class="cleanup-count"><strong>' + counts.reorder + '</strong><span>' + escapeHtml(COPY.cleanupReorderCount) + '</span></div>'
          + '<div class="cleanup-count"><strong>' + counts.move + '</strong><span>' + escapeHtml(COPY.cleanupMoveCount) + '</span></div>'
          + '</div><p>' + escapeHtml(copy("cleanupSelectedCount", { count: selectedCount })) + '</p>'
          + '<div class="cleanup-actions"><button class="secondary" id="cleanupDetailsButton" type="button" aria-controls="cleanupOperationList" aria-expanded="'
          + cleanupSession.detailsExpanded + '"' + (cleanupSession.applyInFlight ? ' disabled' : '') + '>'
          + escapeHtml(cleanupSession.detailsExpanded ? COPY.cleanupHideDetails : COPY.cleanupShowDetails) + '</button>'
          + (cleanupSession.confirmationOpen ? '' : '<button id="prepareCleanupApplyButton" type="button" data-primary-action="true"'
            + (selectedCount === 0 ? ' disabled' : '') + '>' + escapeHtml(COPY.cleanupPrepareApply) + '</button>')
          + '</div>' + renderCleanupOperations(operations) + confirmation + '</section>';
      }

      function renderReadyForDevCandidates() {
        if (cleanupSession.scanState === "idle") return "";
        if (cleanupSession.scanState === "scanning") {
          return '<div class="scope-card"><strong>' + escapeHtml(COPY.cleanupScanningReadyForDev) + '</strong></div>';
        }
        if (cleanupSession.scanState === "error") {
          return '<div class="scope-card"><strong>' + escapeHtml(COPY.cleanupReadyForDevScanFailed) + '</strong></div>';
        }
        if (cleanupSession.scanCandidates.length === 0) {
          return '<div class="scope-card"><strong>' + escapeHtml(COPY.cleanupNoReadyForDev) + '</strong></div>';
        }
        var truncated = cleanupSession.scanTruncated
          ? '<p>' + escapeHtml(copy("cleanupReadyForDevTruncated", { max: READY_FOR_DEV_SCAN_MAX })) + '</p>'
          : "";
        var items = cleanupSession.scanCandidates.map(function (candidate, index) {
          var checked = cleanupSession.scanSelectedIds.indexOf(candidate.nodeId) !== -1;
          return '<li><label><input type="checkbox" id="readyForDevCandidate' + index + '" data-node-id="'
            + escapeHtml(candidate.nodeId) + '"' + (checked ? ' checked' : '') + ' /> '
            + escapeHtml(candidate.name || COPY.unnamedLayer) + '</label></li>';
        }).join("");
        return '<div class="scope-card"><strong>' + escapeHtml(COPY.cleanupReadyForDevTitle) + '</strong>' + truncated
          + '<ul id="readyForDevCandidateList">' + items + '</ul></div>'
          + '<div class="cleanup-actions"><button id="queueReadyForDevButton" type="button"'
          + (cleanupSession.scanSelectedIds.length === 0 || cleanupSession.captureState === "capturing" ? ' disabled' : '')
          + '>' + escapeHtml(COPY.cleanupQueueSelected) + '</button></div>';
      }

      function renderCleanupIdle() {
        var captureReady = cleanupSession.captureState === "ready" && cleanupSession.captures.length > 0;
        var body = COPY.cleanupViewBody;
        if (cleanupSession.captureState === "capturing") body = COPY.cleanupReadingSelection;
        else if (captureReady) {
          body = cleanupSession.captures.length === 1
            ? copy("cleanupScopeReady", {
              name: cleanupSession.captures[0].scope.name,
              count: cleanupSession.captures[0].nodeCount,
            })
            : copy("cleanupBatchReady", { count: cleanupSession.captures.length });
        } else if (cleanupSession.captureError) body = cleanupSelectionError(cleanupSession.captureError);
        var scopeList = captureReady && cleanupSession.captures.length > 1
          ? '<ul>' + cleanupSession.captures.map(function (entry) {
            return '<li>' + escapeHtml(copy("cleanupScopeCompact", {
              name: entry.scope.name || COPY.unnamedLayer,
              count: entry.nodeCount,
            })) + '</li>';
          }).join("") + '</ul>'
          : "";
        var rejectedNote = cleanupSession.rejected.length > 0
          ? '<p>' + escapeHtml(copy("cleanupRejectedSummary", { count: cleanupSession.rejected.length })) + '</p>'
          : "";
        return '<section class="cleanup-panel"><div class="scope-card"><strong>' + escapeHtml(body) + '</strong>'
          + scopeList + rejectedNote + '<p>'
          + escapeHtml(COPY.cleanupScanHelper) + '</p></div>' + renderReadyForDevCandidates() + '<div class="cleanup-actions">'
          + '<button class="secondary" id="refreshCleanupScopeButton" type="button"'
          + (cleanupSession.captureState === "capturing" ? ' disabled' : '') + '>' + escapeHtml(COPY.cleanupRefreshScope) + '</button>'
          + '<button class="secondary" id="scanReadyForDevButton" type="button"'
          + (cleanupSession.scanState === "scanning" ? ' disabled' : '') + '>' + escapeHtml(COPY.cleanupScanReadyForDev) + '</button>'
          + '<button id="startCleanupAnalysisButton" type="button" data-primary-action="true"'
          + (!captureReady || cleanupSession.submissionInFlight ? ' disabled' : '') + '>'
          + escapeHtml(cleanupSession.submissionInFlight ? COPY.cleanupSubmitting : COPY.cleanupStartAnalysis) + '</button></div></section>';
      }

      function renderCleanupBatchList() {
        var created = cleanupSession.tasks.filter(function (entry) { return entry.created; });
        var rows = cleanupSession.tasks.map(function (entry, index) {
          var label = escapeHtml(entry.scopeName || COPY.unnamedLayer);
          if (!entry.created) {
            return '<li><span class="task-status">' + escapeHtml(COPY.cleanupBatchCreateFailed) + '</span><strong>' + label
              + '</strong><button class="secondary" id="retryBatchTask' + index + '" type="button"'
              + (cleanupSession.submissionInFlight ? ' disabled' : '') + '>' + escapeHtml(COPY.cleanupBatchRetry) + '</button></li>';
          }
          return '<li><span class="task-status">' + escapeHtml(cleanupStatusLabel(entry.task.status)) + '</span><strong>' + label
            + '</strong><button id="openBatchTask' + index + '" type="button">' + escapeHtml(COPY.cleanupBatchOpen) + '</button></li>';
        }).join("");
        return '<section class="cleanup-panel"><div class="scope-card"><strong>' + escapeHtml(COPY.cleanupBatchListTitle) + '</strong><p>'
          + escapeHtml(copy("cleanupBatchProgress", { done: created.length, total: cleanupSession.tasks.length }))
          + '</p></div><ul id="cleanupBatchList">' + rows + '</ul></section>';
      }

      function renderCleanupTask() {
        var task = cleanupSession.task;
        if (!task) return cleanupSession.tasks.length > 0 ? renderCleanupBatchList() : renderCleanupIdle();
        if (task.status === "plan-ready" && task.plan) return renderCleanupPlan();
        var action = task.status === "plan-ready"
          ? '<button id="loadCleanupPlanButton" type="button" data-primary-action="true">' + escapeHtml(COPY.cleanupViewPlan) + '</button>'
          : (["queued", "analyzing"].indexOf(task.status) !== -1
            ? '<button class="secondary" id="refreshCleanupTaskButton" type="button">' + escapeHtml(COPY.cleanupRefreshTask) + '</button>'
            : (["blocked", "stale"].indexOf(task.status) !== -1
              ? '<button id="reanalyzeCleanupButton" type="button" data-primary-action="true">' + escapeHtml(COPY.cleanupReanalyze) + '</button>'
              : ''));
        var completion = task.status === "completed" && cleanupSession.completionSummary
          ? '<p>' + escapeHtml(copy("cleanupCompletedCounts", {
            applied: cleanupSession.completionSummary.appliedCount,
            skipped: cleanupSession.completionSummary.skippedCount,
          })) + '</p>'
          : '';
        var completionMark = task.status === "completed"
          ? '<span class="completion-mark" aria-hidden="true">' + escapeHtml(COPY.decorativeMark) + '</span>'
          : '';
        return '<section class="cleanup-status"><span class="task-status">' + escapeHtml(cleanupStatusLabel(task.status)) + '</span><strong>'
          + escapeHtml(cleanupStatusMessage(task.status)) + completionMark + '</strong>'
          + renderDispatchStatus(task)
          + completion + (action ? '<div class="cleanup-actions">' + action + '</div>' : '') + '</section>';
      }

      function bindReadyForDevCandidates() {
        if (cleanupSession.scanState !== "ready" || cleanupSession.scanCandidates.length === 0) return;
        cleanupSession.scanCandidates.forEach(function (candidate, index) {
          var checkbox = document.getElementById("readyForDevCandidate" + index);
          if (!checkbox) return;
          checkbox.addEventListener("change", function (event) {
            var currentIndex = cleanupSession.scanSelectedIds.indexOf(candidate.nodeId);
            if (event.target.checked && currentIndex === -1) cleanupSession.scanSelectedIds.push(candidate.nodeId);
            if (!event.target.checked && currentIndex !== -1) cleanupSession.scanSelectedIds.splice(currentIndex, 1);
            renderCleanupView();
          });
        });
        var queueButton = document.getElementById("queueReadyForDevButton");
        if (queueButton) {
          queueButton.addEventListener("click", function () {
            if (cleanupSession.scanSelectedIds.length === 0) return;
            requestCleanupScope(cleanupSession.scanSelectedIds.slice());
          });
        }
      }

      function bindCleanupBatchList() {
        cleanupSession.tasks.forEach(function (entry, index) {
          if (entry.created) {
            var openButton = document.getElementById("openBatchTask" + index);
            if (openButton) {
              openButton.addEventListener("click", function () { return openBatchTask(entry.taskId); });
            }
            return;
          }
          var retryButton = document.getElementById("retryBatchTask" + index);
          if (retryButton) retryButton.addEventListener("click", function () { return retryBatchTask(index); });
        });
      }

      function bindCleanupControls() {
        var task = cleanupSession.task;
        if (!task && cleanupSession.tasks.length > 0) {
          bindCleanupBatchList();
          return;
        }
        if (!task) {
          document.getElementById("refreshCleanupScopeButton").addEventListener("click", function () {
            return requestCleanupScope();
          });
          document.getElementById("scanReadyForDevButton").addEventListener("click", requestReadyForDevScan);
          bindReadyForDevCandidates();
          if (cleanupSession.captureState === "ready" && cleanupSession.captures.length > 0) {
            document.getElementById("startCleanupAnalysisButton").addEventListener("click", startCleanupAnalysis);
          }
          return;
        }
        if (task.status === "plan-ready" && !task.plan) {
          document.getElementById("loadCleanupPlanButton").addEventListener("click", function () { return loadCleanupTaskDetail(task.id); });
          return;
        }
        if (["queued", "analyzing"].indexOf(task.status) !== -1) {
          document.getElementById("refreshCleanupTaskButton").addEventListener("click", function () { return loadCleanupTaskDetail(task.id); });
          return;
        }
        if (["blocked", "stale"].indexOf(task.status) !== -1) {
          document.getElementById("reanalyzeCleanupButton").addEventListener("click", restartCleanupAnalysis);
          return;
        }
        if (task.status !== "plan-ready" || !task.plan) return;
        document.getElementById("cleanupDetailsButton").addEventListener("click", function () {
          if (cleanupSession.applyInFlight) return;
          cleanupSession.detailsExpanded = !cleanupSession.detailsExpanded;
          renderCleanupView();
          var detailsButton = document.getElementById("cleanupDetailsButton");
          if (detailsButton) detailsButton.focus();
        });
        if (cleanupSession.detailsExpanded) {
          cleanupTaskOperations().forEach(function (operation, index) {
            var checkbox = document.getElementById("cleanupOperation" + index);
            checkbox.checked = cleanupSession.selectedOperationIds.indexOf(operation.operationId) !== -1;
            checkbox.addEventListener("change", function (event) {
              if (cleanupSession.applyInFlight) return;
              var selected = event && event.target ? event.target.checked : checkbox.checked;
              var currentIndex = cleanupSession.selectedOperationIds.indexOf(operation.operationId);
              if (selected && currentIndex === -1) cleanupSession.selectedOperationIds.push(operation.operationId);
              if (!selected && currentIndex !== -1) cleanupSession.selectedOperationIds.splice(currentIndex, 1);
              renderCleanupView();
              var nextCheckbox = document.getElementById("cleanupOperation" + index);
              if (nextCheckbox) nextCheckbox.focus();
            });
          });
        }
        if (cleanupSession.confirmationOpen) {
          document.getElementById("cancelCleanupApplyButton").addEventListener("click", function () {
            if (cleanupSession.applyInFlight) return;
            cleanupSession.confirmationOpen = false;
            renderCleanupView();
            var prepareButton = document.getElementById("prepareCleanupApplyButton");
            if (prepareButton) prepareButton.focus();
            setStatus(COPY.cancelled);
          });
          document.getElementById("confirmCleanupApplyButton").addEventListener("click", beginCleanupApply);
        } else {
          document.getElementById("prepareCleanupApplyButton").addEventListener("click", function () {
            if (cleanupSession.selectedOperationIds.length === 0) return;
            cleanupSession.confirmationOpen = true;
            renderCleanupView();
            var confirmation = document.getElementById("cleanupConfirmationDialog");
            if (confirmation) confirmation.focus();
          });
        }
      }

      function syncActiveBatchEntry() {
        if (!cleanupSession.activeTaskId || !cleanupSession.task) return;
        var entry = findBatchEntry(cleanupSession.activeTaskId);
        if (entry && entry.created) entry.task = cleanupSession.task;
      }

      function renderCleanupView() {
        activeView = "cleanup";
        syncActiveBatchEntry();
        var scopeText = cleanupSession.scopeSummary && cleanupSession.scopeSummary.name
          ? (Number.isInteger(cleanupSession.scopeSummary.nodeCount)
            ? copy("cleanupScopeCompact", {
              name: cleanupSession.scopeSummary.name,
              count: cleanupSession.scopeSummary.nodeCount,
            })
            : cleanupSession.scopeSummary.name)
          : COPY.cleanupViewBody;
        var backToBatch = cleanupSession.task && cleanupSession.tasks.length > 1
          ? '<div class="cleanup-actions"><button class="secondary" id="backToBatchButton" type="button"'
            + (cleanupSession.applyInFlight ? ' disabled' : '') + '>' + escapeHtml(COPY.cleanupBackToBatch) + '</button></div>'
          : '';
        appState.innerHTML = '<section class="feature-view" data-view="cleanup">'
          + renderFeatureHeader(COPY.cleanupTitle, scopeText)
          + backToBatch + renderCleanupTask() + '</section>';
        bindBackHome();
        var backButton = document.getElementById("backToBatchButton");
        if (backButton) backButton.addEventListener("click", closeBatchTask);
        bindCleanupControls();
      }

      function formatWorkflowTime(value) {
        var parsed = new Date(value);
        return Number.isFinite(parsed.getTime()) ? parsed.toLocaleString("zh-TW", { hour12: false }) : COPY.unavailableValue;
      }

      function renderWorkflowTasks() {
        if (workflowSession.loading && !workflowSession.loaded) return '<p>' + escapeHtml(COPY.workflowLoadingTasks) + '</p>';
        if (!workflowSession.loaded || workflowSession.tasks.length === 0) return '<p>' + escapeHtml(COPY.workflowNoTasks) + '</p>';
        var primaryAssigned = false;
        return '<div class="workflow-task-list">' + workflowSession.tasks.map(function (task, index) {
          var canOpen = task.status === "plan-ready";
          var isPrimary = canOpen && !primaryAssigned;
          if (isPrimary) primaryAssigned = true;
          return '<article class="workflow-task-card"><strong>' + escapeHtml(COPY.workflowTaskName) + '</strong>'
            + '<span class="task-status">' + escapeHtml(cleanupStatusLabel(task.status)) + '</span>'
            + '<p>' + escapeHtml(task.scopeName || COPY.cleanupTitle) + '</p>'
            + '<p class="task-meta">' + escapeHtml(copy("workflowUpdatedAt", { time: formatWorkflowTime(task.updatedAt) })) + '</p>'
            + renderDispatchStatus(task)
            + (canOpen ? '<div class="workflow-task-actions"><button' + (isPrimary ? ' data-primary-action="true"' : ' class="secondary"')
              + ' id="openWorkflowTask' + index + '" type="button">' + escapeHtml(COPY.cleanupViewPlan) + '</button></div>' : '')
            + '</article>';
        }).join("") + '</div>';
      }

      function renderWorkflowView() {
        activeView = "workflow";
        appState.innerHTML = '<section class="feature-view" data-view="workflow">'
          + renderFeatureHeader(COPY.workflowFeatureTitle, COPY.workflowViewBody)
          + '<section class="cleanup-panel"><div><h3>' + escapeHtml(COPY.workflowExtractionTitle) + '</h3></div>'
          + renderWorkflowOverview() + '</section><section class="cleanup-panel"><div><h3>' + escapeHtml(COPY.workflowAutomationTitle) + '</h3></div>'
          + renderWorkflowTasks() + '<div class="workflow-task-actions"><button class="secondary" id="refreshWorkflowTasksButton" type="button">'
          + escapeHtml(COPY.refresh) + '</button></div></section></section>';
        bindBackHome();
        document.getElementById("refreshWorkflowTasksButton").addEventListener("click", function () { return loadWorkflowTasks(true); });
        workflowSession.tasks.forEach(function (task, index) {
          if (task.status !== "plan-ready") return;
          document.getElementById("openWorkflowTask" + index).addEventListener("click", function () { return loadCleanupTaskDetail(task.id); });
        });
      }

      function openFeature(view) {
        if (!featureEnabled(view)) return;
        if (view === "cleanup") {
          renderCleanupView();
          if (
            !cleanupSession.task
            && cleanupSession.tasks.length === 0
            && cleanupSession.captureState === "idle"
          ) requestCleanupScope();
          return;
        }
        if (view === "workflow") {
          renderWorkflowView();
          if (!workflowSession.loaded && !workflowSession.loading) loadWorkflowTasks();
          return;
        }
        activeView = "review";
        if (reviewLoaded) renderPendingItem();
        else {
          appState.innerHTML = '<section class="feature-view" data-view="review">'
            + renderFeatureHeader(COPY.reviewTitle, COPY.loadingReviews) + '</section>';
          bindBackHome();
          loadPendingReviews();
        }
      }

      function requestCleanupScope(nodeIds) {
        if (cleanupSession.submissionInFlight || cleanupSession.captureState === "capturing") return;
        cleanupSession.captureState = "capturing";
        cleanupSession.captureError = null;
        cleanupSession.captures = [];
        cleanupSession.rejected = [];
        cleanupSession.scopeSummary = null;
        cleanupSession.confirmationOpen = false;
        if (activeView === "cleanup") renderCleanupView();
        setStatus(COPY.cleanupReadingSelection);
        postToMain({
          type: "capture-cleanup-scopes",
          nodeIds: Array.isArray(nodeIds) ? nodeIds : [],
        });
      }

      function requestReadyForDevScan() {
        if (cleanupSession.scanState === "scanning" || cleanupSession.submissionInFlight) return;
        cleanupSession.scanState = "scanning";
        cleanupSession.scanCandidates = [];
        cleanupSession.scanSelectedIds = [];
        cleanupSession.scanTruncated = false;
        if (activeView === "cleanup") renderCleanupView();
        setStatus(COPY.cleanupScanningReadyForDev);
        postToMain({ type: "scan-ready-for-dev" });
      }

      function handleReadyForDevScanResult(message) {
        var candidates = message.ok === true && Array.isArray(message.candidates)
          ? message.candidates.filter(function (candidate) {
            return candidate
              && typeof candidate.nodeId === "string"
              && candidate.nodeId
              && typeof candidate.name === "string";
          })
          : [];
        if (message.ok !== true) {
          cleanupSession.scanState = "error";
          cleanupSession.scanCandidates = [];
          cleanupSession.scanSelectedIds = [];
          cleanupSession.scanTruncated = false;
          setStatus(COPY.cleanupReadyForDevScanFailed, "error");
        } else {
          cleanupSession.scanState = "ready";
          cleanupSession.scanCandidates = candidates;
          cleanupSession.scanSelectedIds = candidates.map(function (candidate) { return candidate.nodeId; });
          cleanupSession.scanTruncated = message.truncated === true;
          setStatus(candidates.length === 0
            ? COPY.cleanupNoReadyForDev
            : copy("cleanupReadyForDevFound", { count: candidates.length }));
        }
        if (activeView === "cleanup") renderCleanupView();
      }

      function validCapturedScope(entry) {
        return Boolean(
          entry
          && entry.scope
          && typeof entry.scope.nodeId === "string"
          && typeof entry.scope.type === "string"
          && typeof entry.scope.name === "string"
          && Number.isInteger(entry.scope.nodeCount)
          && entry.scope.nodeCount > 0
          && entry.snapshot
          && typeof entry.inputSnapshotHash === "string"
          && /^sha256:[a-f0-9]{64}$/.test(entry.inputSnapshotHash)
        );
      }

      function handleCleanupScopesResult(message) {
        var captured = message.ok === true && Array.isArray(message.scopes)
          ? message.scopes.filter(validCapturedScope).map(function (entry) {
            return {
              scope: { nodeId: entry.scope.nodeId, type: entry.scope.type, name: entry.scope.name },
              nodeCount: entry.scope.nodeCount,
              snapshot: entry.snapshot,
              inputSnapshotHash: entry.inputSnapshotHash,
            };
          })
          : [];
        cleanupSession.rejected = Array.isArray(message.rejected)
          ? message.rejected.filter(function (entry) {
            return entry && typeof entry.errorCode === "string";
          })
          : [];
        if (captured.length > 0) {
          cleanupSession.captureState = "ready";
          cleanupSession.captureError = null;
          cleanupSession.captures = captured;
          cleanupSession.scopeSummary = { name: captured[0].scope.name, nodeCount: captured[0].nodeCount };
          setStatus(captured.length === 1
            ? copy("cleanupScopeReady", { name: captured[0].scope.name, count: captured[0].nodeCount })
            : copy("cleanupBatchReady", { count: captured.length }));
        } else {
          cleanupSession.captureState = "error";
          cleanupSession.captureError = typeof message.errorCode === "string" ? message.errorCode : "invalid-cleanup-snapshot";
          cleanupSession.captures = [];
          cleanupSession.scopeSummary = null;
          setStatus(cleanupSelectionError(cleanupSession.captureError), "error");
        }
        if (activeView === "cleanup") renderCleanupView();
      }

      function cleanupIdempotencyKey(capture) {
        return "figma-cleanup:" + sessionId + ":" + cleanupSession.analysisGeneration + ":" + capture.inputSnapshotHash;
      }

      function findBatchEntry(taskId) {
        for (var index = 0; index < cleanupSession.tasks.length; index += 1) {
          if (cleanupSession.tasks[index].taskId === taskId) return cleanupSession.tasks[index];
        }
        return null;
      }

      function openBatchTask(taskId) {
        var entry = findBatchEntry(taskId);
        if (!entry || !entry.created) return;
        cleanupSession.activeTaskId = taskId;
        cleanupSession.task = entry.task;
        cleanupSession.scopeSummary = { name: entry.scopeName, nodeCount: entry.nodeCount };
        cleanupSession.failureContext = null;
        cleanupSession.completionSummary = null;
        cleanupSession.detailsExpanded = false;
        cleanupSession.confirmationOpen = false;
        cleanupSession.selectedOperationIds = [];
        cleanupSession.selectionRevision = null;
        clearFailure();
        renderCleanupView();
        setStatus(cleanupStatusMessage(entry.task.status));
      }

      function closeBatchTask() {
        if (cleanupSession.applyInFlight) return;
        cleanupSession.activeTaskId = null;
        cleanupSession.task = null;
        cleanupSession.confirmationOpen = false;
        renderCleanupView();
        setStatus("");
      }

      async function createCleanupTask(capture) {
        var response;
        try {
          response = await fetch(coordinatorUrl + "/v1/automation/tasks", {
            method: "POST",
            headers: {
              Accept: "application/json",
              Authorization: "Bearer " + reviewerKey,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              fileKey: pluginContext.fileKey,
              taskType: "figma-cleanup",
              scope: capture.scope,
              snapshot: capture.snapshot,
              inputSnapshotHash: capture.inputSnapshotHash,
              idempotencyKey: cleanupIdempotencyKey(capture),
            }),
          });
        } catch (error) {
          return { ok: false, diagnostic: COPY.diagnosticNetwork };
        }
        if (response.status === 401) return { ok: false, unauthorized: true };
        if (!response.ok) {
          return { ok: false, diagnostic: copy("diagnosticHttp", { status: response.status }) };
        }
        var result = await response.json();
        if (!result || !result.task || typeof result.task.id !== "string" || typeof result.task.status !== "string") {
          return { ok: false, diagnostic: "invalid-automation-task-response" };
        }
        return { ok: true, task: result.task };
      }

      async function retryBatchTask(index) {
        var entry = cleanupSession.tasks[index];
        if (!entry || entry.created || cleanupSession.submissionInFlight || !reviewerKey || !pluginContext) return;
        cleanupSession.submissionInFlight = true;
        renderCleanupView();
        setStatus(COPY.cleanupSubmitting);
        var outcome = await createCleanupTask(entry.capture);
        cleanupSession.submissionInFlight = false;
        if (outcome.unauthorized) {
          reviewerKey = "";
          renderLogin(COPY.invalidAccessCode);
          return;
        }
        if (!outcome.ok) {
          entry.diagnostic = outcome.diagnostic;
          renderCleanupView();
          setFailure("cleanup-create", COPY.cleanupRequestFailure, "cleanup-create", outcome.diagnostic);
          setStatus(COPY.cleanupRequestFailure, "error");
          return;
        }
        entry.taskId = outcome.task.id;
        entry.task = outcome.task;
        entry.created = true;
        entry.diagnostic = null;
        clearFailure();
        renderCleanupView();
        setStatus(copy("cleanupBatchProgress", {
          done: cleanupSession.tasks.filter(function (item) { return item.created; }).length,
          total: cleanupSession.tasks.length,
        }));
      }

      async function startCleanupAnalysis() {
        if (
          cleanupSession.submissionInFlight
          || cleanupSession.task
          || cleanupSession.tasks.length > 0
          || cleanupSession.captureState !== "ready"
          || cleanupSession.captures.length === 0
          || !reviewerKey
          || !pluginContext
        ) return;
        cleanupSession.submissionInFlight = true;
        cleanupSession.tasks = cleanupSession.captures.map(function (capture) {
          return {
            scopeNodeId: capture.scope.nodeId,
            scopeName: capture.scope.name,
            nodeCount: capture.nodeCount,
            capture: capture,
            taskId: null,
            task: null,
            created: false,
            diagnostic: null,
          };
        });
        renderCleanupView();
        setStatus(COPY.cleanupSubmitting);
        var lastDiagnostic = null;
        for (var index = 0; index < cleanupSession.tasks.length; index += 1) {
          var entry = cleanupSession.tasks[index];
          var outcome = await createCleanupTask(entry.capture);
          if (outcome.unauthorized) {
            reviewerKey = "";
            cleanupSession.submissionInFlight = false;
            renderLogin(COPY.invalidAccessCode);
            return;
          }
          if (outcome.ok) {
            entry.taskId = outcome.task.id;
            entry.task = outcome.task;
            entry.created = true;
            entry.diagnostic = null;
          } else {
            entry.created = false;
            entry.diagnostic = outcome.diagnostic;
            lastDiagnostic = outcome.diagnostic;
          }
          renderCleanupView();
          setStatus(copy("cleanupBatchProgress", { done: index + 1, total: cleanupSession.tasks.length }));
        }
        cleanupSession.submissionInFlight = false;
        var created = cleanupSession.tasks.filter(function (item) { return item.created; });
        if (created.length === 0) {
          renderCleanupView();
          setFailure("cleanup-create", COPY.cleanupRequestFailure, "cleanup-create", lastDiagnostic || "cleanup-create-failed");
          setStatus(COPY.cleanupRequestFailure, "error");
          return;
        }
        cleanupSession.failureContext = null;
        cleanupSession.completionSummary = null;
        cleanupSession.detailsExpanded = false;
        cleanupSession.confirmationOpen = false;
        cleanupSession.selectedOperationIds = [];
        cleanupSession.selectionRevision = null;
        if (lastDiagnostic) {
          setFailure("cleanup-create", COPY.cleanupRequestFailure, "cleanup-create", lastDiagnostic);
        } else clearFailure();
        if (cleanupSession.tasks.length === 1) {
          openBatchTask(created[0].taskId);
          return;
        }
        renderCleanupView();
        setStatus(copy("cleanupBatchProgress", { done: created.length, total: cleanupSession.tasks.length }));
      }

      function restartCleanupAnalysis() {
        if (cleanupSession.applyInFlight) return;
        cleanupSession.analysisGeneration += 1;
        cleanupSession.task = null;
        cleanupSession.activeTaskId = null;
        cleanupSession.tasks = [];
        cleanupSession.captures = [];
        cleanupSession.rejected = [];
        cleanupSession.scopeSummary = null;
        cleanupSession.captureState = "idle";
        cleanupSession.captureError = null;
        cleanupSession.submissionInFlight = false;
        cleanupSession.detailInFlight = false;
        cleanupSession.applyAttempt = null;
        cleanupSession.selectedOperationIds = [];
        cleanupSession.selectionRevision = null;
        cleanupSession.detailsExpanded = false;
        cleanupSession.confirmationOpen = false;
        cleanupSession.failureContext = null;
        cleanupSession.completionSummary = null;
        clearFailure();
        requestCleanupScope();
      }

      async function loadCleanupTaskDetail(taskId) {
        if (!taskId || cleanupSession.detailInFlight || !reviewerKey) return;
        cleanupSession.detailInFlight = true;
        setStatus(COPY.workflowLoadingTasks);
        var response;
        try {
          response = await fetch(coordinatorUrl + "/v1/automation/tasks/" + encodeURIComponent(taskId), {
            method: "GET",
            headers: { Accept: "application/json", Authorization: "Bearer " + reviewerKey },
          });
        } catch (error) {
          cleanupSession.detailInFlight = false;
          setFailure("cleanup-detail", COPY.cleanupTaskFailure, "cleanup-detail", COPY.diagnosticNetwork);
          setStatus(COPY.cleanupTaskFailure, "error");
          return;
        }
        if (response.status === 401) {
          reviewerKey = "";
          cleanupSession.detailInFlight = false;
          renderLogin(COPY.invalidAccessCode);
          return;
        }
        if (!response.ok) {
          cleanupSession.detailInFlight = false;
          setFailure("cleanup-detail", COPY.cleanupTaskFailure, "cleanup-detail", copy("diagnosticHttp", { status: response.status }));
          setStatus(COPY.cleanupTaskFailure, "error");
          return;
        }
        var task = await response.json();
        if (!task || typeof task.id !== "string" || typeof task.status !== "string" || task.taskType !== "figma-cleanup") {
          cleanupSession.detailInFlight = false;
          setFailure("cleanup-detail", COPY.cleanupTaskFailure, "cleanup-detail", "invalid-automation-task-detail");
          setStatus(COPY.cleanupTaskFailure, "error");
          return;
        }
        var previousTaskId = cleanupSession.task && cleanupSession.task.id;
        cleanupSession.detailInFlight = false;
        cleanupSession.task = task;
        cleanupSession.scopeSummary = {
          name: task.scopeName || COPY.cleanupTitle,
          nodeCount: previousTaskId === task.id && cleanupSession.scopeSummary
            ? cleanupSession.scopeSummary.nodeCount
            : undefined,
        };
        var recoveredFailure = null;
        if (
          task.failure
          && ["stale-plan", "invalid-plan-operation", "apply-rolled-back", "partial-apply"].indexOf(task.failure.code) !== -1
        ) {
          var recoveredAffected = normalizeCleanupAffectedNodes(task.failure.affectedNodes || []);
          if (recoveredAffected !== null) {
            recoveredFailure = {
              errorCode: task.failure.code,
              documentChanged: task.failure.code === "partial-apply",
              rolledBack: task.failure.rollback === "complete",
              affectedNodes: recoveredAffected,
            };
          }
        }
        cleanupSession.failureContext = recoveredFailure;
        if (previousTaskId !== task.id) {
          cleanupSession.selectedOperationIds = [];
          cleanupSession.selectionRevision = null;
          cleanupSession.detailsExpanded = false;
          cleanupSession.confirmationOpen = false;
        }
        initializeCleanupPlanSelection();
        clearFailure();
        renderCleanupView();
        if (recoveredFailure) {
          var recoveredSummary = cleanupFailureMessage(recoveredFailure);
          setFailure("cleanup-result", recoveredSummary, null, recoveredFailure.errorCode);
          setStatus(recoveredSummary, "error");
        } else setStatus(cleanupStatusMessage(task.status));
      }

      function beginCleanupApply() {
        if (
          !cleanupSession.task
          || !cleanupSession.confirmationOpen
          || cleanupSession.applyInFlight
          || cleanupSession.selectedOperationIds.length === 0
        ) return;
        cleanupSession.applyInFlight = true;
        cleanupSession.applyAttempt = {
          phase: "revalidate",
          requestId: "cleanup-apply:" + sessionId + ":" + Date.now().toString(36) + ":" + Math.random().toString(36).slice(2, 8),
          taskId: cleanupSession.task.id,
          taskType: cleanupSession.task.taskType,
          revision: cleanupSession.task.revision,
          scopeNodeId: cleanupSession.task.scopeNodeId,
          operationIds: cleanupSession.selectedOperationIds.slice(),
          inputSnapshotHash: null,
        };
        renderCleanupView();
        setStatus(COPY.cleanupApplyChecking);
        postToMain({
          type: "revalidate-cleanup-scope",
          requestId: cleanupSession.applyAttempt.requestId,
          scopeNodeId: cleanupSession.applyAttempt.scopeNodeId,
        });
      }

      async function submitCleanupApplyIntent(inputSnapshotHash) {
        var task = cleanupSession.task;
        var attempt = cleanupSession.applyAttempt;
        if (
          !task
          || !attempt
          || !cleanupSession.applyInFlight
          || task.id !== attempt.taskId
          || task.revision !== attempt.revision
          || !/^sha256:[a-f0-9]{64}$/.test(inputSnapshotHash)
        ) return;
        attempt.phase = "apply-intent";
        var response;
        try {
          response = await fetch(coordinatorUrl + "/v1/automation/tasks/" + encodeURIComponent(task.id) + "/apply", {
            method: "POST",
            headers: {
              Accept: "application/json",
              Authorization: "Bearer " + reviewerKey,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              revision: task.revision,
              inputSnapshotHash: inputSnapshotHash,
              operationIds: attempt.operationIds.slice(),
            }),
          });
        } catch (error) {
          if (cleanupSession.applyAttempt !== attempt) return;
          cleanupSession.applyInFlight = false;
          cleanupSession.applyAttempt = null;
          renderCleanupView();
          setFailure("cleanup-apply-intent", COPY.cleanupApplyIntentFailure, "cleanup-apply-intent", COPY.diagnosticNetwork);
          setStatus(COPY.cleanupApplyIntentFailure, "error");
          return;
        }
        if (cleanupSession.applyAttempt !== attempt) return;
        if (response.status === 401) {
          reviewerKey = "";
          cleanupSession.applyInFlight = false;
          cleanupSession.applyAttempt = null;
          renderLogin(COPY.invalidAccessCode);
          return;
        }
        if (!response.ok) {
          var errorPayload = null;
          try {
            errorPayload = await response.json();
          } catch (error) {
            errorPayload = null;
          }
          if (cleanupSession.applyAttempt !== attempt) return;
          var errorCode = errorPayload && errorPayload.error && errorPayload.error.code;
          cleanupSession.applyInFlight = false;
          cleanupSession.applyAttempt = null;
          if (errorCode === "stale-cleanup-plan" || errorCode === "stale-task-revision") {
            cleanupSession.task = Object.assign({}, task, { status: "stale" });
            cleanupSession.confirmationOpen = false;
            renderCleanupView();
            setFailure("cleanup-stale", COPY.cleanupValidationFailed, null, errorCode);
            setStatus(COPY.cleanupValidationFailed, "error");
            return;
          }
          renderCleanupView();
          setFailure("cleanup-apply-intent", COPY.cleanupApplyIntentFailure, "cleanup-apply-intent", copy("diagnosticHttp", { status: response.status }));
          setStatus(COPY.cleanupApplyIntentFailure, "error");
          return;
        }
        var result = null;
        try {
          result = await response.json();
        } catch (error) {
          result = null;
        }
        if (cleanupSession.applyAttempt !== attempt) return;
        if (
          !result
          || !result.task
          || result.task.id !== task.id
          || result.task.taskType !== attempt.taskType
          || result.task.scopeNodeId !== attempt.scopeNodeId
          || result.task.status !== "applying"
          || result.task.revision !== attempt.revision + 1
          || !Array.isArray(result.operations)
          || result.operations.length !== attempt.operationIds.length
          || result.operations.some(function (operation, index) {
            return !operation || operation.operationId !== attempt.operationIds[index];
          })
        ) {
          cleanupSession.applyInFlight = false;
          cleanupSession.applyAttempt = null;
          renderCleanupView();
          setFailure("cleanup-apply-intent", COPY.cleanupApplyIntentFailure, "cleanup-apply-intent", "invalid-cleanup-apply-response");
          setStatus(COPY.cleanupApplyIntentFailure, "error");
          return;
        }
        attempt.inputSnapshotHash = inputSnapshotHash;
        attempt.applyingRevision = result.task.revision;
        attempt.phase = "main-apply";
        cleanupSession.task = Object.assign({}, task, result.task, {
          plan: task.plan,
          failure: task.failure,
        });
        clearFailure();
        renderCleanupView();
        postToMain({
          type: "apply-cleanup-plan",
          requestId: attempt.requestId,
          taskId: result.task.id,
          scopeNodeId: result.task.scopeNodeId,
          inputSnapshotHash: attempt.inputSnapshotHash,
          operations: result.operations,
        });
      }

      function handleCleanupValidationResult(message) {
        var task = cleanupSession.task;
        var attempt = cleanupSession.applyAttempt;
        if (
          !task
          || !attempt
          || !cleanupSession.applyInFlight
          || message.requestId !== attempt.requestId
          || task.id !== attempt.taskId
          || task.revision !== attempt.revision
        ) return;
        if (
          message.ok !== true
          || message.scopeNodeId !== attempt.scopeNodeId
          || typeof message.inputSnapshotHash !== "string"
          || !/^sha256:[a-f0-9]{64}$/.test(message.inputSnapshotHash)
        ) {
          attempt.failureReport = {
            errorCode: message.errorCode === "invalid-plan-operation" ? "invalid-plan-operation" : "stale-plan",
            documentChanged: false,
            rolledBack: false,
            affectedNodes: [],
          };
          submitCleanupFailure();
          return;
        }
        submitCleanupApplyIntent(message.inputSnapshotHash);
      }

      function cleanupFailureMessage(report) {
        if (report.errorCode === "stale-plan") return COPY.cleanupValidationFailed;
        if (report.errorCode === "invalid-plan-operation") return COPY.cleanupInvalidPlan;
        if (report.errorCode === "apply-rolled-back") return COPY.cleanupRolledBack;
        var names = report.affectedNodes.map(function (node) { return node.name; }).filter(Boolean).join(COPY.affectedNodeSeparator);
        return copy("cleanupPartialApply", { names: names || COPY.unnamedLayer });
      }

      function normalizeCleanupAffectedNodes(value) {
        if (!Array.isArray(value) || value.length > 100) return null;
        var seen = Object.create(null);
        var nodes = [];
        for (var index = 0; index < value.length; index += 1) {
          var node = value[index];
          if (
            !node
            || typeof node !== "object"
            || Array.isArray(node)
            || Object.keys(node).sort().join("|") !== "name|nodeId"
            || typeof node.nodeId !== "string"
            || !node.nodeId
            || typeof node.name !== "string"
            || seen[node.nodeId]
          ) return null;
          seen[node.nodeId] = true;
          nodes.push({ nodeId: node.nodeId, name: node.name.trim().slice(0, 200) });
        }
        return nodes;
      }

      function cleanupCompletionProof(message, task, attempt) {
        if (
          message.preflightComplete !== true
          || message.documentChanged !== true
          || typeof message.postApplySnapshotHash !== "string"
          || !/^sha256:[a-f0-9]{64}$/.test(message.postApplySnapshotHash)
          || message.postApplySnapshotHash === attempt.inputSnapshotHash
          || !Array.isArray(message.outcomes)
          || message.outcomes.length !== attempt.operationIds.length
          || !Number.isInteger(message.appliedCount)
          || !Number.isInteger(message.skippedCount)
          || message.appliedCount < 0
          || message.skippedCount < 0
          || message.appliedCount + message.skippedCount !== attempt.operationIds.length
          || !projectContext
          || !projectContext.project
          || typeof projectContext.project.id !== "string"
          || !pluginContext
          || typeof pluginContext.fileKey !== "string"
        ) return null;
        var expected = Object.create(null);
        attempt.operationIds.forEach(function (operationId) { expected[operationId] = true; });
        var seen = Object.create(null);
        var applied = 0;
        var skipped = 0;
        var outcomes = [];
        for (var index = 0; index < message.outcomes.length; index += 1) {
          var outcome = message.outcomes[index];
          if (
            !outcome
            || typeof outcome !== "object"
            || Array.isArray(outcome)
            || Object.keys(outcome).sort().join("|") !== "operationId|status"
            || !expected[outcome.operationId]
            || seen[outcome.operationId]
            || ["applied", "skipped"].indexOf(outcome.status) === -1
          ) return null;
          seen[outcome.operationId] = true;
          if (outcome.status === "applied") applied += 1;
          else skipped += 1;
          outcomes.push({ operationId: outcome.operationId, status: outcome.status });
        }
        if (applied !== message.appliedCount || skipped !== message.skippedCount) return null;
        return {
          taskId: task.id,
          projectId: projectContext.project.id,
          fileKey: pluginContext.fileKey,
          scopeNodeId: task.scopeNodeId,
          taskType: task.taskType,
          inputSnapshotHash: attempt.inputSnapshotHash,
          postApplySnapshotHash: message.postApplySnapshotHash,
          selectedOperationIds: attempt.operationIds.slice(),
          outcomes: outcomes,
          appliedCount: applied,
          skippedCount: skipped,
          pluginSessionId: sessionId,
          completedAt: new Date().toISOString(),
        };
      }

      async function submitCleanupCompletion() {
        var task = cleanupSession.task;
        var attempt = cleanupSession.applyAttempt;
        if (!task || !attempt || !attempt.proof || !reviewerKey) return;
        attempt.phase = "complete";
        cleanupSession.applyInFlight = true;
        if (activeView === "cleanup") renderCleanupView();
        var response;
        try {
          response = await fetch(coordinatorUrl + "/v1/automation/tasks/" + encodeURIComponent(task.id) + "/complete", {
            method: "POST",
            headers: {
              Accept: "application/json",
              Authorization: "Bearer " + reviewerKey,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ revision: task.revision, proof: attempt.proof }),
          });
        } catch (error) {
          if (cleanupSession.applyAttempt !== attempt) return;
          cleanupSession.applyInFlight = false;
          if (activeView === "cleanup") renderCleanupView();
          setFailure("cleanup-complete", COPY.cleanupCompletionFailure, "cleanup-complete", COPY.diagnosticNetwork);
          setStatus(COPY.cleanupCompletionFailure, "error");
          return;
        }
        if (cleanupSession.applyAttempt !== attempt) return;
        if (response.status === 401) {
          reviewerKey = "";
          cleanupSession.applyInFlight = false;
          renderLogin(COPY.invalidAccessCode);
          return;
        }
        if (!response.ok) {
          cleanupSession.applyInFlight = false;
          if (activeView === "cleanup") renderCleanupView();
          var completeRetry = response.status >= 500 ? "cleanup-complete" : null;
          setFailure("cleanup-complete", COPY.cleanupCompletionFailure, completeRetry, copy("diagnosticHttp", { status: response.status }));
          setStatus(COPY.cleanupCompletionFailure, "error");
          return;
        }
        var completed;
        try {
          completed = await response.json();
        } catch (error) {
          completed = null;
        }
        if (
          cleanupSession.applyAttempt !== attempt
          || !completed
          || completed.id !== task.id
          || completed.taskType !== task.taskType
          || completed.scopeNodeId !== task.scopeNodeId
