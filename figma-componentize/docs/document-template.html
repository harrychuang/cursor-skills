<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500&display=swap">
<style>
/* Layout: the page previews one 1440 px Figma frame ("Design System — generated") on a grey canvas.
   Inside: 120 px margins, 1200 px content, 12 columns with 24 px gutters.
   Single light theme by choice: the generated Figma document is always light. */
:root {
  /* Template chrome — the same in every project */
  --canvas: #E8E8ED;   /* Figma canvas behind the frame (preview only) */
  --paper: #FFFFFF;    /* document background */
  --panel: #F5F5F7;    /* stages, tiles, pills */
  --line: #D2D2D7;     /* hairlines */
  --ink: #1D1D1F;      /* primary text */
  --ink-2: #6E6E73;    /* secondary text */
  --ink-3: #86868B;    /* tertiary text: paths, aliases */
  --link: #0066CC;     /* links and spacing bars */
  --font-en: "Inter", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-zh: "Noto Sans TC", "Inter", system-ui, -apple-system, "PingFang TC", sans-serif;
  --track-display: -0.025em;
  --track-title: -0.02em;
  --track-headline: -0.015em;
  /* Sample project "Orbit Travel" — stands in for any project's own tokens */
  --s-font: "Roboto", system-ui, sans-serif;
  --s-primary: #4355B9;
  --s-on-primary: #FFFFFF;
  --s-primary-container: #DEE0FF;
  --s-surface: #FEFBFF;
  --s-on-surface: #1B1B1F;
  --s-on-surface-variant: #46464F;
  --s-outline: #767680;
  --s-outline-variant: #C6C5D0;
  --s-disabled-container: rgba(27, 27, 31, 0.12);
  --s-disabled-content: rgba(27, 27, 31, 0.38);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-en);
  -webkit-font-smoothing: antialiased;
  padding-inline: 16px;
  padding-block: 0 56px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 6px; }

/* ---------- Toolbar (preview only) ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  margin-inline: -16px; padding: 10px 16px;
  background: rgba(232, 232, 237, 0.88);
  -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
  border-bottom: 1px solid rgba(0, 0, 0, 0.06);
}
.bar-in { max-width: 1440px; margin-inline: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.bar-name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.bar-name span { color: var(--ink-2); font-weight: 400; }
.bar-controls { display: flex; flex-wrap: wrap; gap: 10px; }
.seg { display: inline-flex; background: rgba(0, 0, 0, 0.06); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 7px; cursor: pointer; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--paper); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04); }

.frame-label { max-width: 1440px; margin: 28px auto 8px; display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.frame {
  max-width: 1440px; margin-inline: auto; background: var(--paper);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.04), 0 10px 40px rgba(0, 0, 0, 0.06);
  padding-inline: clamp(20px, 8.34vw, 120px);
  padding-block: clamp(48px, 8.34vw, 120px);
  display: flex; flex-direction: column; gap: clamp(72px, 8.34vw, 120px);
}
.frame[lang="zh-Hant"] { font-family: var(--font-zh); --track-display: 0; --track-title: 0; --track-headline: 0; }

/* ---------- Type scale of the template ---------- */
.t-display { font-size: clamp(44px, 5.56vw, 80px); line-height: 1.05; font-weight: 700; letter-spacing: var(--track-display); margin: 0; text-wrap: balance; }
.t-title { font-size: clamp(34px, 3.34vw, 48px); line-height: 1.08; font-weight: 700; letter-spacing: var(--track-title); margin: 0; text-wrap: balance; }
.t-headline { font-size: clamp(26px, 2.23vw, 32px); line-height: 1.25; font-weight: 700; letter-spacing: var(--track-headline); margin: 0; text-wrap: balance; }
.t-subhead { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.005em; margin: 0; }
.t-body { font-size: 19px; line-height: 28px; font-weight: 400; margin: 0; }
.t-callout { font-size: 15px; line-height: 22px; font-weight: 400; margin: 0; }
.t-caption { font-size: 12px; line-height: 18px; font-weight: 400; margin: 0; }
.strong { font-weight: 600; }
.ink-2 { color: var(--ink-2); }
.ink-3 { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Cover ---------- */
.cover { display: flex; flex-direction: column; gap: 40px; }
.cover-top { display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: 19px; line-height: 28px; font-weight: 600; color: var(--ink-2); margin: 0; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; border-top: 1px solid var(--line); padding-top: 32px; }
.stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat b { font-size: clamp(34px, 3.34vw, 48px); line-height: 1.08; font-weight: 700; letter-spacing: var(--track-title); font-variant-numeric: tabular-nums; }
.notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.notes p { max-width: 52ch; }
.contents { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 28px; border-top: 1px solid var(--line); padding-top: 24px; }
.contents a { color: var(--link); text-decoration: none; font-size: 15px; line-height: 22px; }
.contents a:hover { text-decoration: underline; }

/* ---------- Parts and sections ---------- */
.part { display: flex; flex-direction: column; gap: 64px; }
.part-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
.section { display: flex; flex-direction: column; gap: 32px; scroll-margin-top: 72px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; border-top: 1px solid var(--line); padding-top: 24px; }
.block { display: flex; flex-direction: column; gap: 24px; }
.block-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.pill { font-size: 12px; line-height: 18px; font-weight: 500; color: var(--ink-2); background: var(--panel); border-radius: 999px; padding: 3px 10px; }
.group { display: flex; flex-direction: column; gap: 16px; }
.path { font-size: 12px; line-height: 18px; font-weight: 500; color: var(--ink-3); }

/* Swatches */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 32px 24px; }
.swatch { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.chip { position: relative; height: 104px; border-radius: 16px; overflow: hidden; display: flex; }
.chip i { flex: 1; }
.chip::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.07); pointer-events: none; }
.swatch figcaption { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.val { color: var(--ink-2); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.val .mode { display: inline-block; min-width: 38px; color: var(--ink-3); }
.alias { color: var(--ink-3); padding-left: 38px; overflow-wrap: anywhere; }
.alias.single { padding-left: 0; }

/* Rows: typography and spacing */
.rows { border-top: 1px solid var(--line); }
.type-row { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 8px 32px; align-items: baseline; padding-block: 28px; border-bottom: 1px solid var(--line); }
.specimen { font-family: var(--s-font); color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
.bar-row { display: grid; grid-template-columns: minmax(0, 280px) 72px minmax(0, 1fr); gap: 8px 24px; align-items: center; padding-block: 16px; border-bottom: 1px solid var(--line); }
.bar-fill { height: 12px; border-radius: 6px; background: var(--link); max-width: 100%; }

/* Radius tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 32px 24px; }
.tile { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.shape { width: 112px; max-width: 100%; aspect-ratio: 1; background: var(--panel); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.07); }

/* Elevation */
.elev-stage { background: var(--panel); border-radius: 24px; padding: clamp(24px, 3.34vw, 48px); display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 40px; }
.elev-card { background: var(--paper); border-radius: 18px; min-height: 140px; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 22px; }
.tbl th { text-align: left; font-size: 12px; line-height: 18px; font-weight: 600; color: var(--ink-2); padding: 0 16px 10px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 14px 16px 14px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
.tbl td.dim { color: var(--ink-2); }

/* Components */
.comps { display: flex; flex-direction: column; gap: 64px; }
.comp { display: flex; flex-direction: column; gap: 32px; border-top: 1px solid var(--line); padding-top: 24px; scroll-margin-top: 72px; }
.comp-head { display: flex; flex-direction: column; gap: 8px; }
.comp-link { color: var(--link); text-decoration: none; font-size: 15px; line-height: 22px; width: fit-content; }
.comp-link:hover { text-decoration: underline; }
.desc { max-width: 680px; }
.stage { background: var(--panel); border-radius: 24px; padding: clamp(24px, 3.9vw, 56px); display: flex; flex-wrap: wrap; align-items: flex-end; gap: 40px 48px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }
.cell .t-caption { color: var(--ink-2); text-align: center; }
.comp-info { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 48px; }
.info-h { font-size: 15px; line-height: 22px; font-weight: 600; margin: 0 0 8px; }
.tok-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.tok-list li { font-size: 15px; line-height: 22px; padding-block: 10px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }

/* Icons */
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 24px 16px; }
.icon-tile { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.icon-box { width: 100%; max-width: 104px; aspect-ratio: 1; background: var(--panel); border-radius: 18px; display: grid; place-items: center; color: var(--ink); }
.icon-box svg { width: 28px; height: 28px; }
.icon-tile .t-caption { color: var(--ink-2); text-align: center; overflow-wrap: anywhere; }

.foot { border-top: 1px solid var(--line); padding-top: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; color: var(--ink-3); }

/* ---------- Sample project components (the project's own look) ---------- */
.btn { font-family: var(--s-font); font-weight: 500; font-size: 14px; line-height: 20px; height: 40px; padding: 0 24px; border-radius: 20px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; white-space: nowrap; }
.btn-filled { background: var(--s-primary); color: var(--s-on-primary); }
.btn-outlined { border-color: var(--s-outline); color: var(--s-primary); }
.btn-text { color: var(--s-primary); padding: 0 12px; }
.btn.is-disabled { color: var(--s-disabled-content); }
.btn-filled.is-disabled { background: var(--s-disabled-container); }
.btn-outlined.is-disabled { border-color: var(--s-disabled-container); }
.s-chip { font-family: var(--s-font); font-weight: 500; font-size: 14px; line-height: 20px; height: 32px; padding: 0 16px; border-radius: 8px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--s-outline); color: var(--s-on-surface); background: transparent; white-space: nowrap; }
.s-chip.is-selected { background: var(--s-primary-container); border-color: transparent; padding-left: 8px; }
.s-chip svg { width: 18px; height: 18px; }
.s-card { width: 264px; max-width: 100%; border-radius: 12px; background: var(--s-surface); border: 1px solid var(--s-outline-variant); overflow: hidden; font-family: var(--s-font); text-align: left; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15); }
.s-card-media { height: 120px; background: var(--s-primary-container); }
.s-card-body { padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.s-card-title { font-size: 22px; line-height: 28px; color: var(--s-on-surface); }
.s-card-sub { font-size: 14px; line-height: 20px; color: var(--s-on-surface-variant); }

/* ---------- Template spec view ---------- */
.spec { font-family: var(--font-zh); --track-display: 0; --track-title: 0; --track-headline: 0; }
.grid12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: clamp(4px, 1.67vw, 24px); height: 96px; }
.grid12 i { background: rgba(0, 102, 204, 0.08); border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0, 102, 204, 0.18); }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 24px; border-top: 1px solid var(--line); }
.fact { display: flex; justify-content: space-between; gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.fact b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 32px 24px; }
.scale-row { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 8px 32px; align-items: baseline; padding-block: 24px; border-bottom: 1px solid var(--line); }
.scale-row .samples { display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.rules { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 12px; max-width: 760px; }

@media (max-width: 760px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .notes, .comp-info { grid-template-columns: minmax(0, 1fr); }
  .type-row, .scale-row { grid-template-columns: minmax(0, 1fr); }
  .bar-row { grid-template-columns: minmax(0, 1fr) auto; }
  .bar-row .bar-cell { grid-column: 1 / -1; }
  .stage { gap: 28px 32px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
</style>

/* ---------- Template blocks ---------- */
function swatch([name, values, aliases], modes) {
  const many = modes.length > 1;
  const lines = values.map((v, i) => `<div class="t-caption val">${many ? `<span class="mode">${esc(modes[i])}</span>` : ''}${esc(v)}</div>${aliases && aliases[i] ? `<div class="t-caption alias${many ? '' : ' single'}">→ ${esc(aliases[i])}</div>` : ''}`).join('');
  return `<figure class="swatch"><div class="chip">${values.map(v => `<i style="background:${esc(v)}"></i>`).join('')}</div><figcaption><div class="t-callout strong">${esc(leaf(name))}</div>${lines}</figcaption></figure>`;
}
function sectionHead(id, title, count) {
  return `<div class="sec-head"><h3 class="t-headline">${title}</h3><p class="t-callout ink-2 num">${count}</p></div>`;
}
function colorSection() {
  const n = DATA.collections.reduce((a, c) => a + c.groups.reduce((m, g) => m + g.tokens.length, 0), 0);
  const blocks = DATA.collections.map(c => `
    <div class="block">
      <div class="block-head"><h4 class="t-subhead">${esc(c.name)}</h4>${c.modes.length > 1 ? c.modes.map(m => `<span class="pill">${esc(m)}</span>`).join('') : ''}</div>
      ${c.groups.map(g => `<div class="group"><div class="path">${esc(g.path)}</div><div class="swatches">${g.tokens.map(tk => swatch(tk, c.modes)).join('')}</div></div>`).join('')}
    </div>`).join('');
  return `<section class="section" id="sec-color">${sectionHead('color', t('color'), t('n_tokens', { n }))}${blocks}</section>`;
}
function typeSection() {
  const rows = DATA.text.map(([name, family, weight, size, lh, ls, w]) => `

        <p class="eyebrow">版型規格</p>
        <h1 class="t-display">設計系統文件版型</h1>
        <p class="t-body ink-2" style="max-width:40em">版型固定文件本身的樣子：版面、字級、顏色、圓角，以及每一種區塊怎麼排。專案只提供內容：tokens、元件與描述。所以不同專案產生的文件長得一樣，只有內容不同。這頁的數值與 figma-componentize 的 <code>references/documentation.md</code> §12 相同。</p>
      </div>
    </section>
    <div class="part">
      <div class="part-head"><h2 class="t-title">版面</h2><p class="t-callout ink-2">Figma 外框寬度固定 1440 px</p></div>
      <div class="grid12" aria-hidden="true">${'<i></i>'.repeat(12)}</div>
      <div class="facts">
        ${[['外框寬度', TEMPLATE.frame.width], ['四邊內距', TEMPLATE.frame.padding], ['內容寬度', TEMPLATE.content.width], ['欄數', TEMPLATE.content.columns], ['欄距', TEMPLATE.content.gutter], ['大段間距', TEMPLATE.frame.gap + TEMPLATE.frame.partTop], ['小段間距', TEMPLATE.frame.gap], ['區塊內間距', TEMPLATE.space.block], ['項目間距', TEMPLATE.space.item], ['文字群組間距', TEMPLATE.space.inner]].map(([k, v]) => `<div class="fact t-callout"><span class="ink-2">${k}</span><b>${v}</b></div>`).join('')}
      </div>
    </div>
    <div class="part">
      <div class="part-head"><h2 class="t-title">顏色</h2><p class="t-callout ink-2">文件本身的顏色，不使用專案的 tokens</p></div>
      <div class="palette">${chrome.map(([name, hex, role]) => `<figure class="swatch"><div class="chip"><i style="background:${hex}"></i></div><figcaption><div class="t-callout strong">${name}</div><div class="t-caption val">${hex}</div><div class="t-caption ink-3">${role}</div></figcaption></figure>`).join('')}</div>
    </div>
    <div class="part">
      <div class="part-head"><h2 class="t-title">字級</h2><p class="t-callout ink-2">英文 Inter；中文 Noto Sans TC，字距 0</p></div>
      <div class="rows">${scale.map(([name, specText, cls, use]) => `
        <div class="scale-row"><div><div class="t-callout strong">${name}</div><div class="t-caption ink-2">${specText}</div><div class="t-caption ink-3">${use}</div></div>
        <div class="samples"><div class="${cls}" style="font-family:var(--font-en);letter-spacing:${cls === 't-display' ? '-0.025em' : cls === 't-title' ? '-0.02em' : cls === 't-headline' ? '-0.015em' : 'normal'}">Orbit Travel</div><div class="${cls}" style="font-family:var(--font-zh)">設計系統文件</div></div></div>`).join('')}</div>
    </div>
    <div class="part">
      <div class="part-head"><h2 class="t-title">圓角與線條</h2></div>
      <div class="facts">
        ${[['舞台（Variants、陰影）', TEMPLATE.radius.stage], ['圖示格、陰影卡', TEMPLATE.radius.tile], ['色塊', TEMPLATE.radius.chip], ['長條', TEMPLATE.radius.bar], ['標籤（pill）', TEMPLATE.radius.pill], ['分隔線', '1 px · Line'], ['內框', `1 px · 黑 ${Math.round(TEMPLATE.color.inner.opacity * 100)}%`]].map(([k, v]) => `<div class="fact t-callout"><span class="ink-2">${k}</span><b>${v}</b></div>`).join('')}
      </div>
    </div>
    <div class="part">
      <div class="part-head"><h2 class="t-title">區塊</h2><p class="t-callout ink-2">沒有內容的區塊不出現</p></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>區塊</th><th>內容</th><th>尺寸與排法</th></tr></thead>
      <tbody>${blocks.map(([a, b, c]) => `<tr><td><span class="strong">${a}</span></td><td>${b}</td><td class="dim">${c}</td></tr>`).join('')}</tbody></table></div>
    </div>
    <div class="part">
      <div class="part-head"><h2 class="t-title">規則</h2></div>
      <ul class="rules t-body">
        <li>文件本身的顏色、字型、圓角與間距固定，不使用專案的 tokens，所以每個專案的文件長得一樣。</li>
        <li>專案的內容一律是活的：色票、長條、圓角方塊綁定專案的 token；文字樣本與陰影卡套用專案的 style；元件是 instance。</li>
        <li>檔案裡的文字照原樣顯示，包括 token 名稱、元件名稱與描述；只有版型自己的標題和欄位名稱跟著語言變。</li>
        <li>字型用 Inter 與 Noto Sans TC。SF Pro 不是 Figma 內建字型，產生文件的工具也無法載入電腦上安裝的字型，Inter 是最接近的中性無襯線字。</li>
        <li>沒有內容的區塊整段省略，例如檔案沒有 Color styles 時就不出現。</li>
      </ul>
    </div>
    <footer class="foot t-caption"><span>Design System Doc Template · figma-componentize</span><span>references/documentation.md §12</span></footer>`;
}

/* ---------- Controls ---------- */
const state = { view: 'doc', lang: 'en' };
try { Object.assign(state, JSON.parse(localStorage.getItem('dsdoc-template') || '{}')); } catch (e) { /* storage unavailable */ }
function apply() {
  L = LABELS[state.lang] || LABELS.en;
  const doc = document.getElementById('doc');
  doc.setAttribute('lang', state.lang === 'zh' ? 'zh-Hant' : 'en');
  renderDoc();
  document.getElementById('doc').hidden = state.view !== 'doc';
  document.getElementById('spec').hidden = state.view !== 'spec';
  document.getElementById('frame-size').textContent = state.view === 'doc' ? '1440 × auto · sample project: Orbit Travel' : 'Template spec';
  document.getElementById('frame-name').textContent = state.view === 'doc' ? 'Design System — generated' : 'Design System Doc Template';
  for (const [id, on] of [['v-doc', state.view === 'doc'], ['v-spec', state.view === 'spec'], ['l-en', state.lang === 'en'], ['l-zh', state.lang === 'zh']]) document.getElementById(id).setAttribute('aria-pressed', String(on));
  try { localStorage.setItem('dsdoc-template', JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}
document.getElementById('v-doc').addEventListener('click', () => { state.view = 'doc'; apply(); });
document.getElementById('v-spec').addEventListener('click', () => { state.view = 'spec'; apply(); });
document.getElementById('l-en').addEventListener('click', () => { state.lang = 'en'; state.view = 'doc'; apply(); });
document.getElementById('l-zh').addEventListener('click', () => { state.lang = 'zh'; state.view = 'doc'; apply(); });
renderSpec();
apply();
</script>
</body>
</html>
